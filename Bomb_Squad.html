function ansTokens(spec,raw){return spec.kind==='sequence'?raw.split('>').map(x=>x.trim()):(spec.kind==='multi'||spec.kind==='set')?raw.split('+').map(x=>x.trim()):raw}
function answer(spec,key,amber){let a=ansTokens(spec,spec.rules[key]);if(!amber)return a;if(spec.kind==='pick'||spec.kind==='dial')return spec.options[(spec.options.indexOf(a)+1)%spec.options.length];if(spec.kind==='sequence')return [...a].reverse();if(spec.kind==='multi'||spec.kind==='set')return spec.options.filter(x=>!a.includes(x));if(spec.kind==='code')return String(a).slice(0,-1)+((Number(String(a).slice(-1))+1)%10);return a}

function equalResult(spec,provided,target){if(spec.kind==='sequence')return Array.isArray(provided)&&provided.join('|')===target.join('|');if(spec.kind==='multi'||spec.kind==='set')return Array.isArray(provided)&&provided.length===target.length&&provided.every(x=>target.includes(x));return String(provided)===String(target)}
function verifyResult(provided){if(!game||game.phase!=='playing')return;const step=currentStep(),spec=DB[currentType().id][step.specIndex];if(!equalResult(spec,provided,step.target)){gameFail('WRONG MOVE');return}tone(800,.09);game.done++;game.index++;newUI();if(game.index>=game.steps.length){if(game.bombIndex===game.ids.length-1){game.phase='won';tone(1050,.5);render()}else{game.phase='between';render()}}else render()}

else if(spec.kind==='code'){content=`<div class="codebox">${safe(ui.value||'')}<span style="color:#58718a">${'•'.repeat(Math.max(0,3-(ui.value||'').length))}</span></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','⌫','0','C'].map(x=>`<button data-action="key" data-value="${x}">${x}</button>`).join('')}</div>`;actions='<button class="btn btn-primary" data-action="confirm">✓ ENTER CODE</button>'}
return `<div class="work-area">${content}</div><div class="actionbar">${actions}</div>`}
function activeGame(){const t=currentType(),step=currentStep(),spec=DB[t.id][step.specIndex];return `${operatorStatus()}<div class="split"><section class="panel-shell" data-type="${t.id}"><div class="shell-heading"><div><span class="num">BOMB ${game.bombIndex+1}/${game.ids.length} · RULE CARD ${String(step.specIndex+1).padStart(2,'0')}</span><h2>${t.icon} ${t.name}</h2></div><span class="pill">ACTIVE</span></div><div class="panel-inner"><div class="step-info"><div><span class="tiny-label">STEP ${String(game.index+1).padStart(2,'0')} / ${game.totalPer}</span><h3>${safe(spec.title)}</h3></div><span class="pill">${spec.kind==='sequence'?`${step.target.length} PRESSES`:spec.kind==='set'?'SWITCHES':spec.kind==='code'?`${String(step.target).length} DIGITS`:spec.kind==='dial'?'DIAL':spec.kind==='multi'?'SELECT TWO':'ONE CHOICE'}</span></div><div class="clue-row"><div class="clue"><span>${safe(spec.cue)}</span><strong>${safe(step.cue)}</strong></div>${game.level==='2'?`<div class="clue security"><span>SECURITY LIGHT</span><strong>${step.amber?'AMBER':'WHITE'}</strong></div>`:''}</div>${controlUI(spec)}</div></section><aside class="card side-panel"><span class="eyebrow"><i class="dot"></i> TALK TO THE EXPERT</span><h3>Speak before you act.</h3><p>Describe the <strong>${safe(spec.cue.toLowerCase())}</strong> ${game.level==='2'?'and security light ':''}on your panel. Ask for a complete English instruction.</p><div class="tip">💬 “What do I need to do next?”<br>💬 “Could you repeat that, please?”<br>💬 “I can see …”</div><div class="chipline"><span class="chip">No looking at screens</span><span class="chip">English only</span></div><p style="font-size:12px">The Expert has all ten rule cards for this device. Read out the rule-card number too.</p><button class="btn btn-ghost btn-sm" data-action="lang">${rulesOpen?'Hide':'Show'} language help</button>${rulesOpen?`<div class="language lang-content"><p><strong>Operator</strong></p><p>“The screen shows …”</p><p>“There are four …”</p><p>“Which one should I choose?”</p><p>“I have finished that step.”</p><p><strong>Expert</strong></p><p>“First, you need to …”</p><p>“Next, select …”</p><p>“If the light is …, then …”</p><p>“Do not press …”</p></div>`:''}</aside></div>`}
function between(){return `${operatorStatus()}<div class="card intermission"><div class="large">✅</div><span class="eyebrow">BOMB ${game.bombIndex+1} DEFUSED</span><h2>Great teamwork!</h2><p>Tell your partner that the next bomb is coming. The mission timer keeps running.</p><button class="btn btn-primary btn-lg" data-action="next">▶ NEXT BOMB</button></div>`}
function result(){const win=game.phase==='won';return `<section class="card summary ${win?'win':'lose'}"><div class="result-icon">${win?'🎉':'💥'}</div><span class="eyebrow">${win?'MISSION COMPLETE':'MISSION FAILED'}</span><h1>${win?'BOMB DEFUSED!':'BOOM!'}</h1><p>${win?'Excellent teamwork! You solved the puzzle devices together.':game.failureReason==='TIME IS UP'?'The countdown reached zero.':'One incorrect move triggered the alarm. Try again and communicate clearly.'}</p><div class="stats"><div><small>Steps solved</small><strong>${game.done}</strong></div><div><small>Bombs completed</small><strong>${win?game.ids.length:game.bombIndex}</strong></div><div><small>Time left</small><strong>${timeFmt(timeLeft())}</strong></div></div><p>Reflection: Did you use full English sentences? Did you ask questions and listen carefully?</p><div class="actionbar"><button class="btn btn-primary btn-lg" data-action="replay">↻ PLAY AGAIN</button><button class="btn btn-lg" data-action="operator">CHANGE MISSION</button><button class="btn" data-action="home">⌂ HOME</button></div></section>`}
function gameScreen(){return game.phase==='ready'?ready():game.phase==='playing'?activeGame():game.phase==='between'?between():result()}
function manualView(){const t=typeById(expertType);return `<div class="section-top"><div><span class="eyebrow">PLAYER 2 · THE EXPERT</span><h2>${t?t.name:'Defusal manual'}</h2><p>Find your partner's bomb. Read the notes, then give complete English instructions.</p></div><div class="selector"><span class="tiny-label">LEVEL</span><select class="select" id="expertLevel"><option value="1" ${expertLevel==='1'?'selected':''}>MAVO 1 · A1–A2</option><option value="2" ${expertLevel==='2'?'selected':''}>MAVO 2 · A2</option></select></div></div><div class="manual-layout"><aside class="card manual-list">${TYPES.map(tt=>`<button class="manual-item ${expertType===tt.id?'active':''}" data-action="manual" data-type="${tt.id}"><span class="icon">${tt.icon}</span><span><b>${tt.name}</b><small>10 rule cards</small></span></button>`).join('')}</aside><section class="card manual-content">${t?manualDetail(t):`<div style="padding:30px 10px"><h2>Which bomb is it?</h2><p>Ask your partner: <strong>“What type of bomb can you see?”</strong></p><p>Select that bomb from the list. Each manual contains ten numbered rule cards.</p><div class="tip">📖 IMPORTANT: Notes are not full sentences. Turn them into spoken English. Do not show the manual to your partner.</div></div>`}</section></div>`}
function displayAnswer(spec,raw){return safe(raw.replace(/>/g,' → ').replace(/\+/g,' + ').toUpperCase())}
function manualDetail(t){return `<div class="manual-header"><span class="icon">${t.icon}</span><div><span class="eyebrow" style="margin:0 0 4px">MAVO ${expertLevel} · TEN RULE CARDS</span><h2 style="margin:0">${t.name}</h2><p style="margin:5px 0 0">Listen to the clue, find the matching line and speak in full sentences.</p></div></div>${expertLevel==='2'?`<div class="tip" style="margin-bottom:15px"><strong>⚠ MAVO 2 — SECURITY LIGHT</strong><br>Your partner must tell you whether the security light is WHITE or AMBER. WHITE → normal rule. AMBER → extra instruction at the bottom of each card. Apply the extra rule <em>after</em> finding the normal answer.</div>`:''}<div class="tip manual-explanation"><strong>HOW TO USE THESE RULES</strong><div>Each card shows three <strong>possible clues</strong>. The bomb displays ONE clue. Use only the matching row — <strong>not all three</strong>. Arrows (→) show the number and order of presses; + means select the listed items together. For example, “THREE → BLUE → RED” means TWO presses: blue, then red.</div></div><div class="rule-grid">${DB[t.id].map((s,i)=>`<article class="rulecard"><h3><span style="color:#86eaf1">${String(i+1).padStart(2,'0')}.</span> ${safe(s.title)}</h3><div class="kind">${safe(s.cue)} → ${safe(kindHelp[s.kind])}</div>${Object.entries(s.rules).map(([cue,a])=>`<div class="rule-row"><span class="signal">${safe(cue)}</span><span class="target">${displayAnswer(s,a)}</span></div>`).join('')}${expertLevel==='2'?`<div class="adv">🟠 ${safe(advancedHelp[s.kind])}</div>`:''}</article>`).join('')}</div><div class="tip" style="margin-top:16px"><strong>Full Bomb:</strong> Steps 11–15 repeat five of these rule cards with new clues. The Operator reads the rule-card number aloud. <strong>Challenge:</strong> The Operator tells you the new bomb type after each successful device.</div><div class="actionbar"><button class="btn" data-action="print">🖨 PRINT MANUAL</button><button class="btn" data-action="manualoverview">← ALL BOMB TYPES</button></div>`}
function settingsView(){return `<div class="section-top"><div><span class="eyebrow">TEACHER OPTIONS</span><h2>Game settings</h2><p>Saved on this device. The Expert must choose the same MAVO level as the Operator.</p></div></div><div class="card"><div class="settings-grid"><div class="setting"><label for="setLevel">Default level</label><select class="select" id="setLevel"><option value="1" ${settings.level==='1'?'selected':''}>MAVO 1 · A1–A2</option><option value="2" ${settings.level==='2'?'selected':''}>MAVO 2 · A2</option></select></div><div class="setting"><label for="setPractice">Practice: 10 steps</label><select class="select" id="setPractice">${[4,5,6,7,8,10,12,15,20,30].map(n=>`<option ${settings.practice===n?'selected':''} value="${n}">${n} minutes</option>`).join('')}</select></div><div class="setting"><label for="setFull">Full Bomb: 15 steps</label><select class="select" id="setFull">${[8,10,12,15,18,20,25,30].map(n=>`<option ${settings.full===n?'selected':''} value="${n}">${n} minutes</option>`).join('')}</select></div><div class="setting"><label for="setChallenge">Bomb Challenge: 3 × 10 steps</label><select class="select" id="setChallenge">${[12,15,18,20,25,30,35,40,45].map(n=>`<option ${settings.challenge===n?'selected':''} value="${n}">${n} minutes</option>`).join('')}</select></div><div class="setting"><label for="setSound">Sound effects</label><select class="select" id="setSound"><option value="false" ${!settings.sound?'selected':''}>Off · recommended in class</option><option value="true" ${settings.sound?'selected':''}>On</option></select></div><div class="setting"><label for="setStrict">Wrong answers</label><select class="select" id="setStrict"><option value="true" ${settings.strict?'selected':''}>One mistake → BOOM!</option><option value="false" ${!settings.strict?'selected':''}>One free mistake per bomb</option></select></div></div><div class="actionbar" style="justify-content:flex-start"><button class="btn btn-primary" data-action="save">✓ SAVE SETTINGS</button><button class="btn" data-action="home">← BACK</button></div><p style="margin-top:15px;font-size:12px">For fair play, use complete English sentences. Game results are not sent anywhere; no pupil accounts or server required.</p></div>`}
function render(){E.innerHTML=head()+(view==='home'?home():view==='operator'?levelChooser():view==='choose'?bombChooser():view==='game'?gameScreen():view==='manual'?manualView():settingsView())+`<div class="footer">EngliForce · <strong>Make English your superpower!</strong> · Cooperative speaking game</div>`;document.title='EngliForce · Bomb Squad';}
function handleOption(value){if(!game||game.phase!=='playing')return;const spec=DB[currentType().id][currentStep().specIndex],kind=spec.kind;if(kind==='pick'){verifyResult(value);return}if(kind==='sequence'){const max=currentStep().target.length;if(game.ui.picked.length>=max)return;game.ui.picked.push(value)}else if(kind==='multi'||kind==='set'){const p=game.ui.picked;game.ui.picked=p.includes(value)?p.filter(x=>x!==value):[...p,value]}render()}
function confirmStep(){if(!game||game.phase!=='playing')return;const spec=DB[currentType().id][currentStep().specIndex],ui=game.ui;if(spec.kind==='sequence'){if(ui.picked.length!==currentStep().target.length){showToast(`Enter all ${currentStep().target.length} items before confirming.`);return}verifyResult(ui.picked)}else if(spec.kind==='multi'||spec.kind==='set'){verifyResult(ui.picked)}else if(spec.kind==='code'){if(ui.value.length<2){showToast('Enter the whole code.');return}verifyResult(ui.value)}else if(spec.kind==='dial'){verifyResult(spec.options[ui.dial||0])}}
let toastHandle=null;function showToast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#345271;border:1px solid #7fbfd9;color:white;border-radius:12px;z-index:100;box-shadow:0 10px 30px #0009;text-align:center;max-width:95vw';el.textContent=message;document.body.appendChild(el);clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.remove(),2300)}
function applyAction(node){const action=node.dataset.action;switch(action){case'home':if(game&&['playing','between'].includes(game.phase)&&!confirm('Leave this mission? The progress will be lost.'))return;game=null;view='home';rulesOpen=false;render();break;
case'settings':if(game&&['playing','between'].includes(game.phase)&&!confirm('Leave this mission? The progress will be lost.'))return;view='settings';game=null;render();break;
case'operator':game=null;view='operator';render();break;
case'expert':game=null;view='manual';expertType=null;expertLevel=settings.level;render();break;
case'mode':pickedMode=node.dataset.mode;view='choose';render();break;
case'new':makeGame(node.dataset.mode,node.dataset.type);break;
case'start':startGame();break;
case'next':nextBomb();break;
case'replay':makeGame(game.mode,game.chosenType);break;
case'option':handleOption(node.dataset.value);break;
case'undo':game.ui.picked.pop();render();break;
case'dial':{const spec=DB[currentType().id][currentStep().specIndex];game.ui.dial=((game.ui.dial||0)+Number(node.dataset.direction)+spec.options.length)%spec.options.length;render();break}
case'key':{const val=node.dataset.value;if(val==='C')game.ui.value='';else if(val==='⌫')game.ui.value=game.ui.value.slice(0,-1);else if(game.ui.value.length<3)game.ui.value+=val;render();break}
case'confirm':confirmStep();break;
case'manual':expertType=node.dataset.type;render();break;
case'manualoverview':expertType=null;render();break;
case'lang':rulesOpen=!rulesOpen;render();break;
case'print':window.print();break;
case'save':settings.level=document.getElementById('setLevel').value;settings.practice=Number(document.getElementById('setPractice').value);settings.full=Number(document.getElementById('setFull').value);settings.challenge=Number(document.getElementById('setChallenge').value);settings.sound=document.getElementById('setSound').value==='true';settings.strict=document.getElementById('setStrict').value==='true';saveSettings();view='home';render();showToast('Teacher settings saved on this device.');break;}}
E.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;e.preventDefault();applyAction(a)});
E.addEventListener('change',e=>{if(e.target.id==='operatorLevel'){settings.level=e.target.value;saveSettings();render()}else if(e.target.id==='expertLevel'){expertLevel=e.target.value;render()}});
window.addEventListener('keydown',e=>{if(!game||game.phase!=='playing'||view!=='game')return;const spec=DB[currentType().id][currentStep().specIndex];if(spec.kind==='code'){if(/^\d$/.test(e.key)){e.preventDefault();if(game.ui.value.length<3){game.ui.value+=e.key;render()}}else if(e.key==='Backspace'){e.preventDefault();game.ui.value=game.ui.value.slice(0,-1);render()}else if(e.key==='Enter'){e.preventDefault();confirmStep()}}});
// Optional: one free mistake per bomb when the teacher disables strict mode.
const strictVerify=verifyResult;verifyResult=function(provided){if(!game||game.phase!=='playing')return;const step=currentStep(),spec=DB[currentType().id][step.specIndex];if(!equalResult(spec,provided,step.target)&&!settings.strict&&game.mistakes===0){game.mistakes++;newUI();render();showToast('Warning! One incorrect move. Next mistake = BOOM!');return}strictVerify(provided)};
const rawLoad=loadBomb;loadBomb=function(){rawLoad();if(game)game.mistakes=0};
render();
</script>
<style media="print">body{background:white;color:#111}.topbar,.manual-list,.actionbar,.footer,.section-top p,.btn,.tip{display:none!important}.app{max-width:none;padding:0}.manual-layout{display:block}.manual-content,.rulecard{border:1px solid #aaa;background:white;color:#111}.manual-content *,.rulecard *{color:#111!important}.rule-grid{display:grid;grid-template-columns:1fr 1fr}.rulecard{break-inside:avoid}.manual-header{break-after:avoid}.manual-explanation{display:block!important;background:white!important;color:#111!important;border:1px solid #888!important}</style>
</body></html>
