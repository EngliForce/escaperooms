<script>
'use strict';
const STORAGE='time_lock_escaperoom_v1';
const CODES=[3,7,1,9,4,6];
const rooms=[
 {id:'hands',icon:'🖐️',name:'The Workshop',desc:'Ontdek welke wijzer wat aangeeft.',lead:'In de werkplaats ligt het eerste tandwiel achter een glazen kast. De kast reageert alleen op de juiste wijzers.',lesson:`<p><b>Hand</b> betekent in het Engels ook <b>wijzer</b> als we het over een klok hebben.</p><div class="rules"><span class="rule-chip">🟠 <b>Short hand</b> = kleine wijzer = uren</span><span class="rule-chip">🔵 <b>Long hand</b> = grote wijzer = minuten</span></div><p>De grote wijzer telt in stapjes van <b>5 minuten</b>. Op de 1 = 5 minuten, op de 2 = 10 minuten, enzovoort.</p>`,questions:[
  {type:'choose',display:'clock',time:[2,20],prompt:'What does “hand” mean on a clock?',subtitle:'Kies de juiste Nederlandse betekenis.',options:['Een vinger','Een wijzer','Een getal'],correct:1,help:'On a clock betekent hand: wijzer.'},
  {type:'hand',time:[3,10],hand:'hour',prompt:'Which hand shows the hours?',subtitle:'Klik op de juiste wijzer in de klok, of gebruik de knoppen.',help:'De korte, oranje wijzer geeft de uren aan.'},
  {type:'hand',time:[7,25],hand:'minute',prompt:'Which hand shows the minutes?',subtitle:'Klik op de juiste wijzer in de klok, of gebruik de knoppen.',help:'De lange, blauwe wijzer geeft de minuten aan.'},
  {type:'choose',display:'clock',time:[2,25],prompt:'The long hand points to 5. How many minutes is that?',subtitle:'Tel in stapjes van vijf: 5, 10, 15 ...',options:['5 minutes','25 minutes','50 minutes'],correct:1,help:'5 × 5 = 25 minuten.'}
 ]},
 {id:'oclock',icon:'🚪',name:'The Entrance Hall',desc:'Hele uren: o’clock.',lead:'Een groot uurwerk houdt de gangdeur dicht. Stel de klokken goed in om verder te kunnen.',lesson:`<p>Als de grote wijzer op <b>12</b> staat, is het een heel uur. In het Engels gebruik je <b>o’clock</b>.</p><div class="rules"><span class="rule-chip">03:00 = <b>three o’clock</b></span><span class="rule-chip">09:00 = <b>nine o’clock</b></span></div><p>Bij het instellen kun je de wijzers <b>slepen</b> of de knoppen + en − gebruiken.</p>`,questions:[
  {type:'choose',display:'clock',time:[3,0],prompt:'What time is it?',subtitle:'Kijk goed waar de kleine wijzer staat.',options:["Three o'clock","Twelve o'clock","Six o'clock"],correct:0,help:'De kleine wijzer staat op 3, de grote op 12.'},
  {type:'set',target:[6,0],given:'06:00',givenLabel:'Digital time',prompt:'Set the clock.',subtitle:'Zet de wijzers op de digitale tijd. Je kunt slepen of de knoppen gebruiken.',step:5,help:'De kleine wijzer op 6, de grote wijzer op 12.'},
  {type:'choose',display:'digital',time:[9,0],prompt:'How do you say this time in English?',subtitle:'Kijk naar de digitale tijd.',options:["Nine o'clock","Ten o'clock","Nine past twelve"],correct:0,help:'09:00 is nine o’clock.'},
  {type:'set',target:[11,0],given:"Eleven o'clock",givenLabel:'English time',prompt:'Set the clock.',subtitle:'Gebruik beide wijzers.',step:5,help:'De kleine wijzer op 11 en de lange op 12.'}
 ]},
 {id:'past',icon:'🌤️',name:'The Past Gallery',desc:'Minuten ná het uur: past.',lead:'In de galerij hangen klokken die allemaal minuten ná een uur aangeven. Kraak de code van past.',lesson:`<p><b>Past</b> betekent <b>over</b> of <b>na</b>. Je noemt <b>eerst de minuten</b> en daarna <b>het uur dat al begonnen is</b>.</p><div class="rules"><span class="rule-chip">07:10 → <b>ten past seven</b></span><span class="rule-chip">04:20 → <b>twenty past four</b></span></div><p>Bij <b>past</b> neem je het aantal minuten uit de digitale tijd. Het uur verandert niet. We beginnen met stappen van vijf minuten.</p>`,questions:[
  {type:'choose',display:'clock',time:[7,10],prompt:'What time is it?',subtitle:'Kijk naar de korte wijzer en tel de minuten bij de lange wijzer.',options:['Ten to seven','Ten past seven','Seven past ten'],correct:1,help:'10 minuten na 7 uur = ten past seven.'},
  {type:'choose',display:'digital',time:[4,20],prompt:'How do you say 04:20?',subtitle:'Denk aan de volgorde: minuten + past + uur.',options:['Four past twenty','Twenty to four','Twenty past four'],correct:2,help:'04:20: 20 minuten na 4 uur = twenty past four.'},
  {type:'set',target:[2,25],given:'02:25',givenLabel:'Digital time',prompt:'Set the clock.',subtitle:'Let op: de kleine wijzer staat al een stukje voorbij de 2.',step:5,help:'Grote wijzer op 5 (25 minuten), kleine iets voorbij 2.'},
  {type:'choose',display:'clock',time:[5,17],prompt:'What time is it? (Challenge)',subtitle:'Nu geen stappen van vijf: bekijk de kleine streepjes.',options:['Seventeen past five','Seventeen to six','Five past seventeen'],correct:0,help:'17 minuten na 5 uur = seventeen past five.'}
 ]},
 {id:'half',icon:'🌉',name:'The Half Bridge',desc:'Halve uren: half past.',lead:'De brug naar de machinekamer staat stil. Het bedieningspaneel werkt alleen met halve uren.',lesson:`<p><b>Half past</b> betekent <b>30 minuten ná</b> het genoemde uur.</p><div class="rules"><span class="rule-chip">03:30 = <b>half past three</b></span><span class="rule-chip">08:30 = <b>half past eight</b></span></div><p><b>Let op:</b> Nederlands <b>half negen</b> = Engels <b>half past eight</b>. In het Engels noem je het uur dat voorbij is!</p>`,questions:[
  {type:'choose',display:'clock',time:[3,30],prompt:'What time is it?',subtitle:'De grote wijzer staat op 6.',options:['Half past three','Half past four','Thirty to three'],correct:0,help:'30 minuten na 3 uur = half past three.'},
  {type:'choose',display:'digital',time:[8,30],prompt:'What is 08:30 in Dutch?',subtitle:'Lees eerst de Engelse tijd: half past eight.',options:['Half acht','Half negen','Half tien'],correct:1,help:'Half past eight = half negen in het Nederlands.'},
  {type:'set',target:[10,30],given:'10:30',givenLabel:'Digital time',prompt:'Set the clock.',subtitle:'De kleine wijzer moet precies tussen de 10 en 11 staan.',step:5,help:'Grote wijzer op 6. Kleine wijzer halverwege 10 en 11.'}
 ]},
 {id:'to',icon:'⚙️',name:'The To Machine',desc:'Minuten vóór het volgende uur: to.',lead:'De machine rekent terug naar het volgende hele uur. Je hebt twee berekeningen nodig om hem te starten.',lesson:`<p><b>To</b> betekent <b>voor</b> of <b>tot</b>. Je rekent nu anders dan bij past:</p><div class="rules"><span class="rule-chip"><b>1.</b> Minuten over = <b>60 − minuten</b></span><span class="rule-chip"><b>2.</b> Neem het <b>volgende uur</b></span></div><p>Voorbeeld: <b>08:40</b> → 60 − 40 = <b>20</b>; na 8 komt <b>9</b>. Dus <b>twenty to nine</b>.</p><p>De kleine wijzer staat bij 08:40 dus dichter bij 9 dan bij 8.</p>`,questions:[
  {type:'choose',display:'digital',time:[8,40],prompt:'08:40 — hoeveel minuten nog tot het hele uur?',subtitle:'Reken uit: 60 − 40 = ?',options:['40 minuten','20 minuten','30 minuten'],correct:1,help:'60 − 40 = 20 minuten tot 09:00.'},
  {type:'choose',display:'digital',time:[8,40],prompt:'08:40 — welk uur komt hierna?',subtitle:'Bij to noem je het VOLGENDE uur.',options:['Eight','Ten','Nine'],correct:2,help:'Na 08:40 komt 09:00, dus nine.'},
  {type:'choose',display:'clock',time:[8,40],prompt:'What time is it?',subtitle:'Lees de analoge klok. Denk aan de rekensom voor to.',options:['Twenty past eight','Twenty to nine','Forty to eight'],correct:1,help:'60 − 40 = 20; volgende uur 9: twenty to nine.'},
  {type:'set',target:[6,50],given:'06:50',givenLabel:'Digital time',prompt:'Set the clock.',subtitle:'Er zijn nog tien minuten tot zeven uur.',step:5,help:'Grote wijzer op 10, kleine wijzer bijna bij 7.'},
  {type:'choose',display:'digital',time:[9,52],prompt:'How do you say 09:52? (Challenge)',subtitle:'Reken 60 − 52 en denk aan het volgende uur.',options:['Eight to ten','Eight past nine','Twelve to nine'],correct:0,help:'60 − 52 = 8; volgende uur 10: eight to ten.'}

 {id:'quarter',icon:'🔐',name:'The Quarter Vault',desc:'Quarter past en quarter to.',lead:'De kluis bewaart het laatste tandwiel. Alleen wie beide kwartieren beheerst, krijgt hem open.',lesson:`<p><b>Quarter</b> betekent <b>kwartier</b> = 15 minuten.</p><div class="rules"><span class="rule-chip">06:15 = <b>quarter past six</b></span><span class="rule-chip">03:45 = <b>quarter to four</b></span></div><p><b>Quarter past:</b> een kwartier na het uur. <b>Quarter to:</b> een kwartier vóór het volgende uur.</p>`,questions:[

function svgClock(h,m,editable){
  let ticks='',nums='',mintext='';
  for(let i=0;i<60;i++){
    const ang=i*Math.PI/30,major=i%5===0;
    const inRadius=major?149:156,outRadius=166;

  }

  }

    for(let i=1;i<=12;i++){

    }
  }
  const hAngle=((h%12)+(m/60))*30,mAngle=m*6;
  const bounds=state.minuteLabels?'-36 -36 432 432':'-4 -4 368 368';
  return `<svg id="activeClock" class="clock-svg" viewBox="${bounds}" role="img" aria-label="Analoge klok met kleine oranje urenwijzer en lange blauwe minutenwijzer" data-edit="${editable}"><defs><radialGradient id="clockface"><stop offset="65%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d6e5ee"/></radialGradient><filter id="handsShadow"><feDropShadow dx="1" dy="3" stdDeviation="2" flood-opacity=".3"/></filter></defs><circle cx="180" cy="180" r="178" fill="#64879a"/><circle cx="180" cy="180" r="169" fill="url(#clockface)" stroke="#effbff" stroke-width="4"/>${ticks}${nums}${mintext}<g id="hour-hand" transform="rotate(${hAngle} 180 180)" filter="url(#handsShadow)"><line x1="180" y1="197" x2="180" y2="99" stroke="#b86929" stroke-width="15" stroke-linecap="round"/><line x1="180" y1="197" x2="180" y2="99" stroke="#ffb45f" stroke-width="11" stroke-linecap="round"/><circle cx="180" cy="99" r="${editable?11:7}" fill="#ffb45f" stroke="#b56d34" stroke-width="2"/><line class="hand-target" data-hand="hour" role="button" aria-label="Hour hand" tabindex="0" x1="180" y1="168" x2="180" y2="93" stroke="transparent" stroke-width="32"/></g><g id="minute-hand" transform="rotate(${mAngle} 180 180)" filter="url(#handsShadow)"><line x1="180" y1="200" x2="180" y2="61" stroke="#1c7eb2" stroke-width="12" stroke-linecap="round"/><line x1="180" y1="200" x2="180" y2="61" stroke="#62dbff" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="61" r="${editable?11:7}" fill="#62dbff" stroke="#20799f" stroke-width="2"/><line class="hand-target" data-hand="minute" role="button" aria-label="Minute hand" tabindex="0" x1="180" y1="94" x2="180" y2="50" stroke="transparent" stroke-width="30"/></g><circle cx="180" cy="180" r="11" fill="#0c3048" stroke="#cbdde8" stroke-width="3"/></svg>`;
}
function bindClock(){const svg=document.getElementById('activeClock');if(!svg)return;const q=getQ();const editable=q.type==='set';const hit=svg.querySelectorAll('[data-hand]');hit.forEach(el=>{el.addEventListener('click',e=>{if(!editable&&q.type==='hand'){e.stopPropagation();answerHand(el.dataset.hand)}});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(q.type==='hand')answerHand(el.dataset.hand);}});});if(!editable)return;svg.addEventListener('pointerdown',e=>{if(state.feedback?.good)return;const handle=e.target.closest('[data-hand]');if(!handle)return;dragKind=handle.dataset.hand;svg.setPointerCapture(e.pointerId);moveFromPointer(svg,e);e.preventDefault();});svg.addEventListener('pointermove',e=>{if(dragKind)moveFromPointer(svg,e)});svg.addEventListener('pointerup',()=>dragKind=null);svg.addEventListener('pointercancel',()=>dragKind=null);}

function hintForQuestion(q){

    if(state.room===4) return 'Bij to tel je hoeveel minuten nog ontbreken tot 60 en noem je het volgende uur. Gebruik de wijzers om beide te vinden.';
    if(state.room===5) return 'Wijzer op 3 = quarter past; op 9 = quarter to. Bij to moet je het volgende uur noemen.';
    return 'Lees eerst de minutenwijzer. Tot en met 30 minuten gebruik je past, na 30 minuten gebruik je to en het volgende uur.';
  }
  if(q.type==='set') return 'Gebruik de gegeven tijd. Draai eerst de grote wijzer naar de minuten en daarna de kleine wijzer naar het uur. Kijk goed waar de kleine wijzer tussen twee cijfers hoort.';
  return q.help;
}
function showHint(){state.hint=!state.hint;render();}
function toggleMinuteLabels(){state.minuteLabels=!state.minuteLabels;render();}
function toggleLesson(){state.lessonCollapsed=!state.lessonCollapsed;render();}
function answerChoice(i){if(state.feedback?.good)return;const q=getQ();if(i===q.correct){solve(q.help);}else{state.wrong++;state.selectedWrong=i;state.feedback={good:false,text:state.wrong>=2?'Probeer opnieuw. Gebruik de hint of kijk naar de uitleg hierboven.':'Kijk nog eens goed. Je mag het opnieuw proberen.'};render();}}
function answerHand(hand){if(state.feedback?.good)return;const q=getQ();if(hand===q.hand)solve(q.help);else{state.wrong++;state.feedback={good:false,text:'Kijk naar de kleuren: 🟠 kleine wijzer = uren; 🔵 grote wijzer = minuten.'};render();}}
function checkSet(){if(state.feedback?.good)return;const q=getQ();if(state.setHour===q.target[0]&&state.setMinute===q.target[1]){solve('Goed ingesteld! '+timeText(...q.target)+'. '+q.help)}else{state.wrong++;state.feedback={good:false,text:state.wrong>=2?'Kijk goed waar de grote wijzer staat en of de kleine wijzer tussen de juiste uren staat.':'Nog niet goed. Controleer de stand van de kleine en grote wijzer.'};render();}}
function solve(expl){state.feedback={good:true,text:safe(expl)};state.selectedWrong=null;render();}
function nextQuestion(){const r=rooms[state.room];state.progress[state.room]++;state.feedback=null;state.hint=false;state.digitalHint=false;state.selectedWrong=null;state.wrong=0;state.setHour=12;state.setMinute=0;persist();if(state.progress[state.room]>=r.questions.length){state.solved[state.room]=true;persist();state.screen='cleared';}render();scrollUp();}
function clearedHTML(){const r=rooms[state.room],isGear=state.room<6;return `<section class="panel completed-screen"><div class="big-gear">${isGear?'⚙️':'🕰️'}</div><span class="eyebrow">Mission accomplished</span><h2>${isGear?'Tandwiel gevonden!':'De hoofdklok werkt!'}</h2><p>Je hebt alle puzzels in <b>${safe(r.name)}</b> opgelost. ${isGear?'Er verschijnt een cijfer op het tandwiel. Bewaar dit voor het eindslot.':'Je hebt alle klokken hersteld. De laatste deur wacht op de zes cijfers die je hebt verzameld.'}</p>${isGear?`<div class="earned-digit">${CODES[state.room]}</div><p>Ruimte ${state.room+1} · codecijfer ${state.room+1} van 6</p>`:`<div class="code-row">${CODES.map(d=>`<div class="code-cell">⚙</div>`).join('')}</div>`}<div class="row" style="justify-content:center;margin-top:22px"><button class="btn btn-primary" onclick="${state.room===6?'goFinal()':'goMap()'}">${state.room===6?'Naar het eindslot 🔐':'Terug naar de plattegrond ➜'}</button></div></section>`;}
function goMap(){state.screen='map';state.feedback=null;render();scrollUp();}
function goFinal(){if(!allRooms())return;state.screen='final';state.codeInput='';render();scrollUp();}
function finalHTML(){return `<div class="screen-head"><button class="btn btn-small btn-ghost" onclick="goMap()">← Plattegrond</button><span class="q-index">FINAL PUZZLE</span></div><section class="panel completed-screen"><div class="final-door"></div><span class="eyebrow">The last lock</span><h2>Unlock the clock tower</h2><p>Je hebt alle zeven ruimtes opgelost. Vul de <b>zes cijfers</b> van de tandwielen in, in de volgorde van de ruimtes.</p><div class="code-row">${CODES.map((d,i)=>`<div class="code-cell">${state.solved[i]?d:'?'}</div>`).join('')}</div><div class="lock-display" id="lock-display">${'●'.repeat(state.codeInput.length)+'○'.repeat(6-state.codeInput.length)}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(n=>`<button onclick="${n==='⌫'?'backspaceCode()':n==='✓'?'submitCode()':'pressCode('+n+')'}" aria-label="${n==='⌫'?'Wis laatste cijfer':n==='✓'?'Open slot':'Cijfer '+n}">${n}</button>`).join('')}</div><div id="lock-message" role="status" class="help-text">Voer de code in en druk op ✓.</div></section>`;}
function pressCode(d){if(state.codeInput.length<6)state.codeInput+=d;updateLock();}
function backspaceCode(){state.codeInput=state.codeInput.slice(0,-1);updateLock();}
function updateLock(){const el=document.getElementById('lock-display');if(el)el.textContent='●'.repeat(state.codeInput.length)+'○'.repeat(6-state.codeInput.length);const x=document.getElementById('lock-message');if(x)x.textContent='Voer de code in en druk op ✓.';}
function submitCode(){const box=document.getElementById('lock-message');if(state.codeInput===CODES.join('')){pauseTimer();state.completedMs=Math.round(state.elapsedMs);state.won=true;persist();state.screen='victory';render();scrollUp();}else{const msg=state.codeInput.length<6?'Je hebt nog niet alle zes cijfers ingevoerd.':'De code klopt nog niet. Kijk naar de volgorde van je tandwielen.';state.codeInput='';updateLock();if(box)box.textContent=msg;}}
function victoryHTML(){return `<section class="panel completed-screen"><div class="win-glow">🎉</div><span class="eyebrow">The clock is ticking again</span><h2>YOU ESCAPED!</h2><p>Je hebt de klokkentoren gerepareerd, alle zeven ruimtes opgelost en de deur geopend. Je kent nu <b>hour hand</b>, <b>minute hand</b>, <b>o’clock</b>, <b>past</b>, <b>half past</b>, <b>to</b> en <b>quarter</b>.</p><div class="time-result" role="status"><div class="time-symbol">⏱️</div><div><div class="time-heading">Jouw totale speeltijd</div><div class="time-count">${timerText(state.completedMs??state.elapsedMs)}</div><div class="time-note">minuten : seconden · tijd loopt alleen als de app zichtbaar is</div></div></div><div class="callout">🏆 <b>Time Detective — Mission completed!</b><br>Onthoud: <b>past</b> telt vanaf het uur. <b>to</b> rekent naar het volgende uur.</div><div class="row" style="justify-content:center"><button class="btn btn-primary" onclick="goMap()">Bekijk de plattegrond</button><button class="btn btn-ghost" onclick="resetConfirm()">Speel opnieuw ↻</button></div></section>`;}
function resetConfirm(){if(confirm('Weet je zeker dat je opnieuw wilt beginnen? Je verzamelde tandwielen en voortgang worden gewist.')){pauseTimer();try{localStorage.removeItem(STORAGE)}catch(e){}state={screen:'welcome',room:0,progress:Array(rooms.length).fill(0),solved:Array(rooms.length).fill(false),hint:false,minuteLabels:false,digitalHint:false,wrong:0,selectedWrong:null,setHour:12,setMinute:0,feedback:null,codeInput:'',won:false,started:false,elapsedMs:0,completedMs:null};render();scrollUp();}}
restore();render();runTimer();
</script>
</body>
</html>
