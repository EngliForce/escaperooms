{icon:'🥞',title:'FILE A — The Pancake Race',tag:'Olney · England',text:`Every year, the English town of Olney has a very unusual race. On Pancake Day (also called Shrove Tuesday), women run through the streets with a frying pan and a pancake. Many runners wear an apron and a headscarf. They toss the pancake in the air while they run. The race finishes near a church.\n\nA local story says that the first race was in 1445. Today, there are also races for children. Pancake Day is in February or March. The date changes every year because it depends on Easter. People come to watch the race and have fun together. It is a funny tradition, but for the runners it is also a real competition.`},
{icon:'🧀',title:'FILE B — Cheese Rolling',tag:'Cooper’s Hill · England',text:`Imagine running down a very steep hill after a big, round cheese! That is what people do at Cooper’s Hill, near Gloucester in England. The race usually takes place on the last Monday in May.\n\nA large wheel of Double Gloucester cheese rolls down the hill. The runners chase it. The hill is so steep that people often fall over. The first person to reach the bottom wins the cheese. Thousands of people come to watch this strange event. It looks funny, but the race is dangerous and people sometimes get hurt. You do not need to run to enjoy it. Many visitors simply watch from a safe place.`},
{icon:'🔥',title:'FILE C — Up Helly Aa',tag:'Lerwick · Shetland, Scotland',text:`Every winter, people in Lerwick, on the Scottish Shetland Islands, celebrate Up Helly Aa. It takes place on the last Tuesday in January. The festival is inspired by Viking history.\n\nPeople put on special costumes and carry burning torches through the streets. A leader called the Guizer Jarl wears Viking-style clothes. Later in the evening, the people throw their torches into a wooden Viking-style ship and set it on fire. There are also songs, dancing and parties. Many visitors come to see the lights and the fire. It is a local Scottish festival, not a holiday that everyone in Britain celebrates. The town works for many months to prepare the big event.`}

function checkAnswer(){if(state.answerOK)return;const q=ROOMS[state.room].questions[state.qi];let good=false,hasAnswer=true;if(q.t==='choice'){if(selectedChoice<0)return;good=choiceOrder[selectedChoice]===q.c}else if(q.t==='write'){let val=document.getElementById('writeAnswer').value;hasAnswer=!!norm(val);good=q.a.some(a=>norm(a)===norm(val));if(!hasAnswer){document.getElementById('writeAnswer').focus();return}}else{hasAnswer=chosen.length>0;good=chosen.map(i=>q.tiles[i]).join(' ')===q.words.join(' ');if(!hasAnswer)return}
if(!good){state.attempts++;save();document.getElementById('feedback').innerHTML=`<div class="feed error"><strong>Not quite! Try again.</strong>Read the question one more time. You can use a hint if you need help.</div>`;if(q.t==='choice')document.querySelectorAll('[data-choice]').forEach(el=>el.classList.toggle('wrong',+el.dataset.choice===selectedChoice));return}
state.answerOK=true;const box=document.getElementById('feedback');box.innerHTML=`<div class="feed"><strong>✓ Correct! The lock clicks open.</strong>${escapeHTML(q.why||'Well done!')}</div>`;if(q.t==='choice')document.querySelectorAll('[data-choice]').forEach(el=>{el.disabled=true;el.classList.remove('selected','wrong');if(choiceOrder[+el.dataset.choice]===q.c)el.classList.add('correct')});if(q.t==='write')document.getElementById('writeAnswer').disabled=true;document.getElementById('actionZone').innerHTML=`<button type="button" class="btn primary" onclick="nextQuestion()">${state.qi===ROOMS[state.room].questions.length-1?'Collect the gear ⚙️':'Next challenge →'}</button>`}
function showHint(){if(state.answerOK)return;const q=ROOMS[state.room].questions[state.qi];state.hints++;save();document.getElementById('feedback').innerHTML=`<div class="feed" style="background:#244959;border-color:#7babc5"><strong>💡 Hint</strong>${escapeHTML(q.h||'Look at the important words in the question.')}</div>`}
function nextQuestion(){if(!state.answerOK)return;state.answerOK=false;state.qi++;if(state.qi>=ROOMS[state.room].questions.length){state.gears.push(ROOMS[state.room].digit);state.phase='unlock';state.qi=0}else state.phase='play';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderUnlock(){const r=ROOMS[state.room];app.innerHTML=`<div class="panel center" style="max-width:770px;margin:20px auto"><div class="eyebrow">ROOM ${state.room+1} COMPLETE</div><h1>Gear found!</h1><p class="lead" style="margin:auto">You solved every challenge in <strong>${escapeHTML(r.name)}</strong>. The Holiday Machine is one step closer to working again.</p><div class="gearbox"><span class="gear">⚙️</span><div class="eyebrow">Secret code digit</div><div class="code">${r.digit}</div><p class="smallmuted">Remember the order of the gears!</p></div>${gearsHTML()}<div class="buttonbar" style="justify-content:center"><button class="btn primary" onclick="advance()">${state.room===ROOMS.length-1?'Go to the final lock 🔐':'Enter the next room →'}</button></div></div>`}
function advance(){if(state.room===ROOMS.length-1){state.room=ROOMS.length;state.phase='lock'}else{state.room++;state.phase='play'}save();render();window.scrollTo(0,0)}
function renderLock(){app.innerHTML=`<section class="panel win center"><div class="winicon">🔐</div><div class="eyebrow">THE FINAL DOOR</div><h1>The last lock</h1><p class="lead" style="margin:0 auto 18px">You have all six gears! Type the six digits in the order you found them. The correct code opens the exit.</p>${gearsHTML()}<div style="margin:24px auto 12px"><label class="label" for="finalcode">Six-digit secret code</label><div style="margin-top:9px"><input id="finalcode" class="final-code-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="••••••" onkeydown="if(event.key==='Enter')tryLock()"></div></div><div class="buttonbar" style="justify-content:center"><button class="btn primary" onclick="tryLock()">Unlock the exit 🔓</button></div><div id="lockFeedback" role="status"></div></section>`}
function tryLock(){const input=document.getElementById('finalcode'),val=input.value.trim();if(val===ROOMS.map(x=>x.digit).join('')){pause();state.done=true;state.phase='won';save();render();window.scrollTo(0,0)}else{state.attempts++;save();document.getElementById('lockFeedback').innerHTML=`<div class="feed error" style="max-width:480px;margin:18px auto">That code does not work. Check the digits and their order.</div>`}}
function renderVictory(){const score=time(state.elapsed),percent=TOTAL;app.innerHTML=`<section class="panel win center"><div class="winicon">🎉</div><div class="eyebrow tick">MISSION COMPLETE</div><h1>YOU ESCAPED!</h1><p class="lead" style="margin:0 auto 23px">Amazing work, Agent! You repaired the Holiday Machine and opened the school’s secret exit.</p><div class="info-grid" style="max-width:640px;margin:auto"><div class="info-item"><strong>${score}</strong><span>Total playing time</span></div><div class="info-item"><strong>${percent}/${TOTAL}</strong><span>Challenges solved</span></div><div class="info-item"><strong>${state.gears.length}/6</strong><span>Gears collected</span></div></div><div class="gearbox" style="margin:25px 0"><div class="eyebrow">Your completed code</div><div class="code" style="font-size:clamp(35px,7vw,60px)">${state.gears.join('')}</div><p class="smallmuted">Wrong attempts: ${state.attempts} · Hints used: ${state.hints}</p></div><div class="buttonbar" style="justify-content:center"><button class="btn primary" onclick="copyResult()">📋 Copy my result</button><button class="btn secondary" onclick="newGame()">↺ Play again</button></div><div id="copyStatus" class="smallmuted" style="margin-top:12px"></div></section>`}
function copyResult(){let t=`THE HOLIDAY HEIST – MAVO 2\nCompleted: ${TOTAL}/${TOTAL} challenges\nTime: ${time(state.elapsed)}\nWrong attempts: ${state.attempts}\nHints used: ${state.hints}`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>document.getElementById('copyStatus').textContent='Result copied!').catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.left='-10000px';document.body.appendChild(el);el.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}el.remove();document.getElementById('copyStatus').textContent=ok?'Result copied!':'You can show this results screen to your teacher.'}
function newGame(){if(!confirm('Start again? Your saved progress and playing time will be reset.'))return;pause();try{localStorage.removeItem(STORAGE)}catch(e){}state={phase:'intro',room:0,qi:0,gears:[],attempts:0,hints:0,elapsed:0,done:false,answerOK:false};activeStart=null;render();window.scrollTo(0,0)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume()});window.addEventListener('pagehide',pause);setInterval(()=>{updateHeader();if(activeStart!==null)save()},1000);resume();render();
</script>
</body>
</html>
