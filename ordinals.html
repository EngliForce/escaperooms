<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ordinal Escape: The Ten Locks</title><style>
:root{--bg:#081321;--panel:#11243a;--panel2:#19314b;--line:#36516a;--a:#ffca57;--ok:#70e0a0;--bad:#ff8793;--text:#f0f5fa;--muted:#b6c7d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1b3c56,#081321 75%);color:var(--text);font:16px/1.5 system-ui,Arial,sans-serif;min-height:100vh}.shell{max-width:790px;margin:auto;padding:19px 16px 38px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-size:14px;letter-spacing:.17em;color:var(--a);font-weight:800}.small{font-size:13px;color:var(--muted)}.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:6px 11px;border-radius:100px;font-size:13px}.progress{height:8px;border-radius:10px;background:#293e53;overflow:hidden;margin:18px 0 22px}.progress>div{height:100%;width:0%;background:linear-gradient(90deg,#42d5cf,#ffd166);transition:width .3s}.card{background:rgba(17,36,58,.96);border:1px solid #38516a;border-radius:22px;padding:26px;box-shadow:0 18px 60px #0005}.eyebrow{color:var(--a);font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,43px);line-height:1.1;margin:12px 0}h2{font-size:clamp(24px,4vw,34px);line-height:1.15;margin:10px 0 12px}p{margin:8px 0 15px}.sub{color:var(--muted);max-width:60ch}.lead{font-size:18px}.button{border:0;background:var(--a);color:#17212c;border-radius:12px;font-weight:800;font-size:16px;padding:12px 20px;cursor:pointer;min-height:46px}.button:hover{filter:brightness(1.08)}.button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#2b465f;color:#f6f9fc}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.input{background:#071b2c;color:white;border:2px solid #54708a;border-radius:11px;padding:11px 13px;font-size:20px;width:100%;max-width:390px;outline:none}.input:focus{border-color:var(--a)}label{display:block;font-size:14px;color:var(--muted);font-weight:700;margin:12px 0 6px}.note{background:#203b50;padding:12px 15px;border-radius:10px;margin:14px 0}.feedback{min-height:28px;margin:12px 0;color:var(--bad);font-weight:700}.feedback.ok{color:var(--ok)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tilegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(100%,350px);margin:18px 0}.tile{aspect-ratio:1;background:#24415d;color:white;border:2px solid #57708c;border-radius:9px;cursor:pointer;font-size:21px;font-weight:800}.tile.selected{background:#ffd166;color:#11243a;border-color:#fff2ba}.tile:focus-visible{outline:3px solid white}.dots{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.dot{width:34px;height:38px;background:#071b2c;border:1px solid #66839c;border-radius:8px;display:grid;place-items:center;font-weight:800}.clue{font-family:ui-monospace,Consolas,monospace;background:#071827;color:#f8d78c;padding:11px 15px;border-radius:9px;display:inline-block;font-size:20px;font-weight:800;letter-spacing:.08em}.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:18px 0}.book{border:2px solid #66819b;background:#355879;border-radius:4px 8px 8px 4px;padding:14px 3px;text-align:center;font-size:23px;font-weight:800;min-width:0}.option{display:block;text-align:left;width:100%;max-width:480px;background:#25435e;color:white;border:2px solid #607c94;border-radius:10px;padding:12px 15px;margin:9px 0;cursor:pointer;font-size:17px}.option.selected{border-color:#ffda73;background:#61512e}.digits{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}.digits input{width:61px;text-align:center;font-size:25px;font-weight:800}.code-entry{letter-spacing:.15em;text-transform:uppercase}.success{border:1px solid #5ccda3;background:#173c3a;border-radius:15px;padding:18px;margin-top:17px}.success strong{color:#9ff7c9;font-size:19px}.footer{text-align:center;font-size:12px;color:#89a0b6;margin-top:18px}.timer{font-variant-numeric:tabular-nums}.hide{display:none!important}@media(max-width:480px){.card{padding:19px}.tilegrid{gap:5px}.tile{border-radius:6px;font-size:18px}.shelf{gap:4px}.book{font-size:19px}.chip{font-size:12px}.shell{padding:10px 9px 22px}}

.inventory{margin-top:15px;background:#10283d;border:1px solid #46617a;border-radius:14px;padding:13px}.inventory h3{margin:0 0 8px;font-size:15px;color:#ffca57}.items{display:flex;gap:7px;flex-wrap:wrap}.item{border:1px solid #6f8da7;background:#1c3b54;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer}.item:focus-visible{outline:3px solid #ffca57}.question{padding:11px 0;border-bottom:1px solid #35506a}.question:last-of-type{border:0}.question label{font-size:15px;color:#f0f5fa;margin:0 0 7px}.question .input{font-size:17px;padding:8px 10px}.five{display:grid;gap:5px}.choices{display:flex;gap:7px;flex-wrap:wrap}.choice{padding:9px 13px;border-radius:8px;border:1px solid #819aae;background:#25435e;color:white;cursor:pointer}.choice.selected{background:#f7d27e;color:#142337;border-color:white}.tilegrid{width:min(100%,320px);gap:5px;margin:10px 0}.tile{font-size:13px}.notice{font-size:13px;color:#b6c7d8}.timer.late{color:#ff8793}.inventorybar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body><main class="shell"><div class="top"><div><div class="brand">ENGLISH // ESCAPE MISSION</div><div class="small">The Ten Locks · Ordinal numbers</div></div><div class="hud"><span class="chip" id="lockCounter">LOCK 0/10</span><span class="chip timer" id="timer">10:00</span></div></div><div class="progress"><div id="bar"></div></div><section class="card" id="screen" aria-live="polite"></section><aside class="inventory" id="inventory"><div class="inventorybar"><h3>🎒 Inventory — saved access codes</h3><span class="small" id="invCount">0 / 9</span></div><div class="items" id="invItems"><span class="small">Your codes will appear here automatically.</span></div></aside><div class="footer">Play individually · British English · Keyboard and touch friendly</div></main><script>
'use strict';
const screen=document.getElementById('screen'),bar=document.getElementById('bar'),timerEl=document.getElementById('timer'),counter=document.getElementById('lockCounter'),invItems=document.getElementById('invItems'),invCount=document.getElementById('invCount');
const codes=['481','705','219','643','852','316','970','524','138'];
let level=0,started=false,finished=false,interval=null,endAt=0,wrong=0,found=[],stage='intro',selected=[];
const norm=x=>String(x??'').toLowerCase().trim().replace(/[‐‑–—]/g,'-').replace(/\s+/g,' ');
function button(txt,fn,cls='button'){const b=document.createElement('button');b.className=cls;b.type='button';b.textContent=txt;b.addEventListener('click',fn);return b}
function setFeedback(msg,good=false){const e=document.getElementById('feedback');if(e){e.textContent=msg;e.className='feedback'+(good?' ok':'')}}
function updateHUD(){bar.style.width=(level===0?0:Math.min(100,(stage==='solved'?level:level-1)*10))+'%';counter.textContent=`LOCK ${stage==='solved'?level:Math.max(0,level-1)}/10`;invItems.replaceChildren();invCount.textContent=`${found.length} / 9`;if(!found.length){let sp=document.createElement('span');sp.className='small';sp.textContent='Your codes will appear here automatically.';invItems.append(sp)}for(const item of found){invItems.append(button(`🔑 Lock ${item.lock}: ${item.code}`,()=>{if(stage==='gate'){const i=document.getElementById('gate');if(i){i.value=item.code;i.focus();setFeedback('Code copied from your inventory.',true)}}else setFeedback(`Saved code for Lock ${item.lock}: ${item.code}`,true)},'item'))}}
function clock(){if(!started||finished)return;const left=Math.max(0,Math.ceil((endAt-Date.now())/1000));timerEl.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left===0){timerEl.classList.add('late');timerEl.title='Time is up, but you can finish the escape room.';clearInterval(interval);interval=null;}}
function start(){if(started)return;started=true;level=1;endAt=Date.now()+600000;interval=setInterval(clock,250);clock();stage='puzzle';render()}
function view(title,info,body){screen.innerHTML=`<div class="eyebrow">${level?`LOCK ${level} OF 10`:'YOUR MISSION'}</div><h2>${title}</h2><p class="sub">${info}</p>${body}<div id="feedback" class="feedback" role="status"></div><div class="actions" id="actions"></div>`;updateHUD()}
function getVal(i){return document.getElementById('q'+i)?.value??''}
function fiveInputs(title,info,questions,answers,help){view(title,info,`<div class="five">${questions.map((q,i)=>`<div class="question"><label for="q${i}">${i+1}. ${q}</label><input class="input" id="q${i}" spellcheck="false" autocomplete="off" placeholder="Your answer"></div>`).join('')}</div>`);document.getElementById('actions').append(button('Check all five answers',()=>{let bad=[];for(let i=0;i<5;i++){if(norm(getVal(i))!==norm(answers[i]))bad.push(i+1)}if(!bad.length)solve();else{wrong++;setFeedback(`Check question${bad.length>1?'s':''} ${bad.join(', ')}. ${help||'Try again!'}`)}}));screen.querySelectorAll('input').forEach(e=>e.addEventListener('keydown',ev=>{if(ev.key==='Enter')document.querySelector('#actions .button')?.click()}))}
function choiceRounds(title,info,rounds){selected=Array(5).fill(-1);view(title,info,`<div class="five">${rounds.map((r,i)=>`<div class="question"><label>${i+1}. ${r.prompt}</label><div class="choices" id="choices${i}"></div></div>`).join('')}</div>`);rounds.forEach((r,i)=>r.options.forEach((opt,j)=>{let b=button(opt,()=>{selected[i]=j;document.getElementById('choices'+i).querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')},'choice');document.getElementById('choices'+i).append(b)}));document.getElementById('actions').append(button('Check five choices',()=>{const bad=rounds.map((r,i)=>selected[i]===r.correct?null:i+1).filter(Boolean);if(!bad.length)solve();else{wrong++;setFeedback(`Check question${bad.length>1?'s':''} ${bad.join(', ')}.`)}}))}
function solve(){stage='solved';const last=level===10;if(!last&&!found.some(x=>x.lock===level))found.push({lock:level,code:codes[level-1]});view(last?'🔓 You escaped!':`🔓 Lock ${level} opened!`,last?'All ten challenges are complete. You escaped from school!':'Your access code has been added to your inventory automatically.',last?`<div class="success"><strong>MISSION COMPLETE!</strong><p>All 50 questions solved. Incorrect checks: ${wrong}.</p><p>${Math.max(0,Math.ceil((endAt-Date.now())/1000))>0?'You beat the ten-minute clock!':'You completed the mission!'}</p></div>`:`<div class="note">Code for the next door: <span class="clue">${codes[level-1]}</span><p class="notice">Don't worry if you click too quickly. The code stays in your inventory below.</p></div>`);if(last){finished=true;clearInterval(interval);document.getElementById('actions').append(button('Play again',()=>location.reload()))}else document.getElementById('actions').append(button('Next door →',()=>gate()))}
function gate(){stage='gate';view('Security keypad','Enter the code from the previous room. You can click its saved code in the inventory below to fill the keypad.',`<label for="gate">Three-digit access code</label><input class="input" id="gate" inputmode="numeric" maxlength="3" placeholder="Enter code" autocomplete="off"><p class="notice">Tip: Click a code in your inventory to fill this box.</p>`);const validate=()=>{if(document.getElementById('gate').value.trim()===codes[level-1]){level++;stage='puzzle';render()}else{wrong++;setFeedback('Access denied. Look in your inventory for the previous lock’s code.')}};document.getElementById('actions').append(button('Unlock the next room',validate));document.getElementById('gate').addEventListener('keydown',e=>{if(e.key==='Enter')validate()})}
function grid(){let target=[2,7,13,19,24],clicks=[];view('The Floor Tiles','Five hidden floor switches. Count from left to right, starting with the top row. Click these squares IN ORDER: 2nd, 7th, 13th, 19th and 24th.',`<div class="tilegrid" id="tiles" aria-label="Grid of 25 unnumbered squares"></div><p id="tileprogress" class="notice">0 / 5 correct switches found</p>`);const area=document.getElementById('tiles');for(let n=1;n<=25;n++){const t=button('',()=>{if(clicks.includes(n))return;if(n===target[clicks.length]){clicks.push(n);t.classList.add('selected');document.getElementById('tileprogress').textContent=`${clicks.length} / 5 correct switches found`;setFeedback('Correct square!',true);if(clicks.length===5)solve()}else{wrong++;setFeedback('Wrong square. Count carefully and try again.')}} ,'tile');t.setAttribute('aria-label',`Row ${Math.ceil(n/5)}, column ${(n-1)%5+1}`);area.append(t)}document.getElementById('actions').append(button('Reset the tiles',()=>grid(),'button secondary'))}
function library(){const books=['A','R','E','L','C','T','O','S','N','P'];fiveInputs('The Library Shelf',`Ten books appear from left to right: ${books.map((s,i)=>s).join(' · ')}. Type the LETTER from each position.`,['Letter on the 3rd book?','Letter on the 10th book?','Letter on the 1st book?','Letter on the 8th book?','Letter on the 6th book?'],['e','p','a','s','t'],'Count positions from the left.');}
function dates(){fiveInputs('The Secret Calendar','Write each ordinal date in English. Write only the day, not the month.',['3rd of May','12th of June','21st of July','30th of August','31st of October'],['third','twelfth','twenty-first','thirtieth','thirty-first'],'Remember spelling and hyphens.')}
function final(){fiveInputs('The Final Door','The final keypad has five security checks. Write the answer requested in each question.',['Write 22nd in full.','Which number is fortieth? (digits)','Write 15th in full.','Which number is twenty-ninth? (digits)','Write 100th in full.'],['twenty-second','40','fifteenth','29','one hundredth'],'Check the exact word or number requested.')}
function render(){if(!started){view('🔒 The Ten Locks','You are trapped in school. Solve ten different puzzles to unlock the exit. Each puzzle contains FIVE questions or steps. Work on your own.',`<div class="note"><b>Rules:</b> The clock starts when you press Start. Answer all five parts of each challenge. Every code you find will be kept safely in your inventory. If your ten minutes run out, you can still finish.</div>`);document.getElementById('actions').append(button('Start the escape →',start));return}switch(level){case 1:grid();break;case 2:fiveInputs('The Broken Words','Correct all five spelling mistakes. Write the correct ordinal in full.',['Correct: twelveth','Correct: nineth','Correct: fourty-first','Correct: fiveth','Correct: twentythird'],['twelfth','ninth','forty-first','fifth','twenty-third']);break;case 3:fiveInputs('The Missing Steps','Complete each sequence. Write each missing ordinal in full.',['first, second, ...','seventh, eighth, ...','twenty-eighth, ..., thirtieth','eleventh, twelfth, ...','thirty-eighth, thirty-ninth, ...'],['third','ninth','twenty-ninth','thirteenth','fortieth']);break;case 4:library();break;case 5:dates();break;case 6:choiceRounds('The Fake IDs','In each row, select the ONE incorrectly spelled ordinal.',[{prompt:'Find the mistake.',options:['first','second','thirth'],correct:2},{prompt:'Find the mistake.',options:['eighth','nineth','tenth'],correct:1},{prompt:'Find the mistake.',options:['twelfth','twentieth','fourty-fifth'],correct:2},{prompt:'Find the mistake.',options:['fifth','threeteenth','sixteenth'],correct:1},{prompt:'Find the mistake.',options:['thirtieth','fifteenth','twentythird'],correct:2}]);break;case 7:fiveInputs('The Number Machine','Convert each ordinal word into its number, including the correct suffix (st, nd, rd or th).',['seventh','twenty-first','forty-second','thirtieth','ninety-third'],['7th','21st','42nd','30th','93rd']);break;case 8:choiceRounds('The Safe Buttons','Choose the correctly spelled ordinal in each row.',[{prompt:'Choose the correct spelling.',options:['fifth','fiveth','fith'],correct:0},{prompt:'Choose the correct spelling.',options:['twelveth','twelth','twelfth'],correct:2},{prompt:'Choose the correct spelling.',options:['fortieth','fourtieth','fortyth'],correct:0},{prompt:'Choose the correct spelling.',options:['twenty first','twenty-first','twenty-oneth'],correct:1},{prompt:'Choose the correct spelling.',options:['nineth','ninth','ninetth'],correct:1}]);break;case 9:fiveInputs('The Emergency Message','Read five riddles. Write the ordinal answer in full.',['I come after nineteenth, before twenty-first.','I come before twelfth, after tenth.','I am the ordinal for 50.','I am one after twenty-ninth.','I am the ordinal for 8.'],['twentieth','eleventh','fiftieth','thirtieth','eighth']);break;case 10:final();break}}
render();
</script></body></html>
