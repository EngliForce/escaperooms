/* Version 1.1 — touch-first iPad layout and accessible evidence popup. */
body{font-size:16px}
.main-layout{display:block;max-width:1350px;margin:18px auto 0}
.mission{width:100%}
.tasks{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.task-card{padding:22px}
.task-card p,.task-card .lead,.checkpoint p{font-size:16px;line-height:1.6}
.choice{font-size:16px;line-height:1.45;min-height:50px;padding:13px 15px;align-items:center}
.choice input{width:19px;height:19px;margin-top:0}
.btn{min-height:46px;font-size:15px}
.btn.small{min-height:44px;font-size:14px}
.task-head p{font-size:15px}
.field{font-size:16px;min-height:46px}
.form-row label,.hint-box,.error-box,.hint-btn{font-size:15px}
.task-status{font-size:13px}
.task-card .card-index{font-size:12px}
.scenehero p{font-size:16px;line-height:1.65}
.scenehero .hero-copy{padding:28px 34px}
.brief-content p{font-size:17px}
.brief-feature p{font-size:15px}
.found-list button,.class-buttons button{min-height:44px;font-size:15px;padding:10px 12px}
.spot{min-width:44px;min-height:44px;touch-action:manipulation}
.move{min-width:44px;min-height:44px}
.case-top-button{display:inline-flex}
.case-fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:70;box-shadow:0 12px 30px #0009;border:2px solid #f0d29c;padding:12px 17px}
.fab-count{background:#172b32;color:#fff1c8;border-radius:50%;padding:2px 8px;min-width:28px;text-align:center}
.case-modal-open{overflow:hidden}
.case-overlay{position:fixed;inset:0;z-index:95;background:#03090ddc;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,30px);overscroll-behavior:contain}
.case-overlay .case-dialog{position:relative;inset:auto;display:flex;flex-direction:column;gap:0;width:min(840px,100%);max-height:calc(100dvh - 28px);min-height:0;overflow:hidden;border:1px solid #879d9e;border-radius:18px;box-shadow:0 28px 75px #000d}
.case-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 24px 13px;flex:none;border-bottom:1px solid #40545b}
.case-heading h2{margin:5px 0 0;font:30px Georgia,serif}
.case-counter{font:13px system-ui,sans-serif;color:var(--teal);vertical-align:middle;margin-left:12px;white-space:nowrap}
.case-close{flex:none}
.case-overlay .notebook-tabs{margin:0;padding:15px 22px 14px;flex:none;border-bottom:1px solid #40545b;gap:9px}
.case-overlay .notebook-tabs button{font-size:15px;font-weight:700;min-height:48px;padding:10px 12px}
.case-body{padding:10px 26px 22px;min-height:0;overflow-y:auto;overscroll-behavior:contain;flex:1;font-size:16px}
.case-body p,.case-body .person b,.case-body .person span{font-size:16px;line-height:1.55}
.case-body .evidence{padding:13px 15px;margin:14px 0}
.case-body .evidence small{font-size:12px}
.case-body .evidence strong{font-size:18px}
.case-body .evidence p{font-size:16px;margin:5px 0}
.case-body .person{padding:16px 2px}
.case-body .gloss{font-size:16px;min-height:44px}
.case-body .notepad{display:block;font-size:17px;min-height:210px;margin:13px 0 0;line-height:1.6;resize:vertical;background:#132a35}
.saved-note{color:var(--good)!important;font-size:14px!important}
.case-overlay .notebook-footer{flex:none;align-items:center;padding:12px 24px;gap:14px}
.case-overlay .notebook-footer span{font-size:13px;color:var(--muted)}
@media(max-width:950px){
 .shell{padding:14px 18px 95px}
 .tasks{grid-template-columns:1fr}
 .task-card.wide{grid-column:auto}
 .task-card{padding:22px}
 .scenehero{display:block;min-height:0}
 .scenehero .scene-img{width:100%;opacity:.19;mask-image:none}
 .scenehero .hero-copy{padding:26px 28px;background:linear-gradient(90deg,#11212ff2,#11212fd9)}
 .scenehero h1{font-size:clamp(32px,5vw,43px)}
 .topbar{flex-wrap:wrap;gap:12px}
 .topright{margin-left:auto}
 .brief-content{width:90%}
}
@media(max-width:600px){
 .shell{padding:12px 12px 92px}
 .task-card{padding:17px}
 .case-overlay{padding:0;align-items:stretch}
 .case-overlay .case-dialog{border-radius:0;width:100%;height:100dvh;max-height:100dvh}
 .case-heading{padding:18px 16px 10px}
 .case-heading h2{font-size:24px}
 .case-counter{margin-left:4px;font-size:12px}
 .case-close span{display:none}
 .case-overlay .notebook-tabs{padding:12px 9px;gap:5px}
 .case-overlay .notebook-tabs button{font-size:13px;padding:8px 2px}
 .case-body{padding:8px 15px 18px}
 .case-overlay .notebook-footer{padding:10px 15px}
 .case-overlay .notebook-footer span{display:none}
 .case-fab{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}
 .scenehero .hero-copy{padding:20px}
 .scenehero p{font-size:16px}
}


/* Version 1.2 — clear A2 reading on iPads. Do not shrink the viewport or disable pinch zoom. */
:root{
 --reading:19px;
 --reading-meta:15px;
 --reading-button:18px;
 --reading-heading:28px;
 --reading-interview:19px;
}
:root[data-text-size="0"]{
 --reading:17px;--reading-meta:14px;--reading-button:16px;--reading-heading:25px;--reading-interview:17px;
}
:root[data-text-size="2"]{
 --reading:23px;--reading-meta:18px;--reading-button:22px;--reading-heading:32px;--reading-interview:23px;
}
body{font-size:var(--reading);line-height:1.6;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.text-controls{display:flex;align-items:center;gap:5px;padding:4px;border-radius:11px;border:1px solid #5a6a71;background:#152833;white-space:nowrap}
.text-controls-label{font-size:var(--reading-meta);font-weight:700;padding:0 6px;color:#e8e2d7}
.text-controls .btn{min-width:50px;min-height:44px;padding:7px 9px;font-size:var(--reading-button);background:#304656}
.text-controls .btn:disabled{opacity:.37}
.topbar{gap:13px}
.brandtitle{font-size:22px}
.brandtag{font-size:12px;letter-spacing:.10em}
.brandmark{flex:none}
.top-pill{font-size:var(--reading-meta)}
.topright .btn.small{font-size:var(--reading-meta);min-height:44px}
.btn,.btn.small{font-size:var(--reading-button);min-height:50px;padding:12px 17px}
.eyebrow,.card-index,.task-card .card-index,.hero-quote,.location{font-size:var(--reading-meta)!important;letter-spacing:.075em}
.task-status{font-size:var(--reading-meta)}
.task-card h3{font-size:var(--reading-heading);line-height:1.22}
.task-card p,.task-card .lead,.checkpoint p,.task-head p,.scenehero p,.brief-content p,.brief-feature p,.alert-line,.victory p{font-size:var(--reading);line-height:1.63}
.choice,.order-item,.match-row b,.class-row,.class-row p,.found-list button,.inspect-result,.form-row label,.hint-btn,.hint-box,.error-box,.success-tag span,.task-card .success-tag,.class-buttons button,.dialogue p,.dialogue b,.task-head .top-pill{
 font-size:var(--reading)!important;
}
.choice{min-height:58px;padding:15px 17px;line-height:1.48;}
.choice input{width:23px;height:23px;flex:none}
.task-card{padding:24px}
.order-item{min-height:58px;line-height:1.48}
.order-item .num{width:33px;height:33px}
.order-item .move{min-height:48px;min-width:48px;font-size:25px}
.match-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field,.notepad{font-size:var(--reading);min-height:52px}
.dialogue{padding:18px 20px}
.dialogue p{line-height:1.57!important}
.class-buttons button,.found-list button{min-height:50px}
.brief-feature b{font-size:26px}
.scenehero h1{font-size:clamp(33px,3.8vw,50px)}
.task-head h2,.checkpoint h3{font-size:30px}
.case-body p,.case-body .person b,.case-body .person span,.case-body .gloss,.case-body .evidence p,.case-body .notepad{font-size:var(--reading)}
.case-body .evidence strong{font-size:calc(var(--reading) + 2px)}
.case-body .evidence small,.case-counter,.case-overlay .notebook-footer span,.notebook-kicker{font-size:var(--reading-meta)}
.case-overlay .notebook-tabs button{font-size:var(--reading-button);min-height:52px}
.case-heading h2{font-size:32px}
.case-fab{font-size:var(--reading-button)}
.footnote,.progress-top,.chapter-dot{font-size:var(--reading-meta)}
@media(max-width:1250px){
 .tasks{grid-template-columns:1fr;max-width:930px;margin:0 auto}
 .task-head{max-width:930px;margin-left:auto;margin-right:auto}
 .task-card.wide{grid-column:auto}
 .task-card{padding:24px 27px}
 .topbar{flex-wrap:wrap}
 .topright{margin-left:auto}
}
@media(max-width:850px){
 .scenehero .hero-copy{padding:24px}
 .scenehero .scene-img{width:100%;opacity:.22;mask-image:none}
 .brief-content{padding:28px;width:100%}
 .brief-hero img{opacity:.35;mask-image:none}
 .case-overlay .case-dialog{width:min(840px,100%)}
}
@media(max-width:600px){
 .shell{padding:14px 13px 106px}
 .topbar{align-items:flex-start}
 .topright{gap:7px;justify-content:flex-start;width:100%;margin:0}
 .brandtitle{font-size:20px}
 .brandtag{display:none}
 .text-controls-label{display:none}
 .text-controls .btn{min-width:48px}
 .task-card{padding:20px 17px}
 .task-head{flex-wrap:wrap;align-items:center}
 .scenehero h1{font-size:36px}
 .brief-content h1{font-size:clamp(35px,10vw,49px)}
 .brief-hero{min-height:0}
 .brief-hero .brief-content{padding:26px 20px}
 .brief-features{grid-template-columns:1fr}
 .match-row{grid-template-columns:1fr}
 .case-heading h2{font-size:27px}
 .case-overlay .notebook-tabs button{padding:9px 4px;font-size:clamp(14px,4vw,var(--reading-button))}
 .case-body .gloss{flex-wrap:wrap}
}
.topright .text-controls .btn{font-size:var(--reading-button);padding:7px 10px}

/* Version 1.3 — varied evidence and linked-clue investigation */
.packet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.packet-option{display:flex;flex-direction:column;align-items:stretch;gap:9px;text-align:left;background:#192c38;border:2px solid #466270;color:var(--ink);padding:19px;border-radius:13px;font-size:var(--reading);line-height:1.4;min-height:190px;touch-action:manipulation}
.packet-option:hover,.packet-option:focus-visible{border-color:var(--gold);background:#2e3a3c}
.packet-option span{display:block}
.packet-option b{color:#ecc890}
.packet-number{font-size:var(--reading-meta);letter-spacing:.08em;color:var(--teal);font-weight:800;padding-bottom:8px;border-bottom:1px solid #49626a}
.clue-reminder,.trail-tip{background:#223536;padding:12px 15px;border-left:3px solid var(--gold);border-radius:6px}
.signal-record{border-left-color:var(--teal)}
.signal-journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.signal-journey span{background:#223946;border:1px solid #5b7379;padding:13px 6px;border-radius:9px;text-align:center;color:#f3d7a5;font-size:var(--reading-meta);font-weight:800}
.code-large{max-width:300px;font-size:calc(var(--reading) + 8px);letter-spacing:.24em;text-align:center;font-weight:800}
.lock-notice{border:1px solid #6d725e;background:#28303a;padding:16px;border-radius:10px;font-size:var(--reading);line-height:1.6;color:#f5d79a}
.case-overlay .notebook-tabs{flex-wrap:wrap}
.case-overlay .notebook-tabs button{flex:1 1 120px}
@media(max-width:700px){.packet-grid{grid-template-columns:1fr}.packet-option{min-height:0}.signal-journey{grid-template-columns:repeat(2,minmax(0,1fr))}.case-overlay .notebook-tabs button{flex:1 1 29%;font-size:var(--reading-meta)}}

  

/* Detective Edition · extended research dossiers, iPad first */
.task-card:has(.case-documents){grid-column:1/-1;background:linear-gradient(145deg,#182d3a,#111f2b);border-color:#5a6262;}
.case-documents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:18px 0 22px}
.case-paper{padding:17px 19px;background:#e8dfc9;color:#26333b;border:1px solid #b3a482;border-radius:10px;box-shadow:inset 0 0 0 2px #cbbf9f,0 6px 15px #0002;min-width:0}
.case-paper .paper-heading{font-size:14px;line-height:1.4;letter-spacing:.07em;font-weight:850;color:#654d31;border-bottom:1px solid #b5a787;padding-bottom:9px;margin-bottom:10px}
.case-paper p{white-space:normal;line-height:1.65;font-size:18px;margin:0}
.research-form{background:#0c1c27;border:1px solid #526572;padding:18px;border-radius:13px}
.research-intro{font-size:15px;color:var(--teal);font-weight:800;letter-spacing:.05em;margin-bottom:12px}
.research-row{display:grid;grid-template-columns:1.2fr 1fr auto;align-items:center;gap:12px;padding:12px 5px;border-top:1px solid #364956}
.research-row label{font-weight:600;font-size:18px;line-height:1.5}
.research-row label b{color:var(--gold);margin-right:6px}
.research-row .field{min-height:47px;font-size:18px;max-width:100%;width:100%}
.research-mark{font-size:12px;min-width:88px;font-weight:800;color:var(--teal)}
.research-row.is-correct{background:#8cd7a415;border-radius:7px}
.research-row.is-wrong{background:#e7897b13;border-radius:7px}
.research-row.is-wrong .research-mark{color:var(--red)}
.research-form .btn.primary{margin-top:15px}
.research-tip{font-size:14px;color:var(--muted);margin:11px 0 0}
html[data-text-size="2"] .research-row label,html[data-text-size="2"] .case-paper p{font-size:23px}
html[data-text-size="0"] .research-row label,html[data-text-size="0"] .case-paper p{font-size:17px}
@media(max-width:1080px){.research-row{grid-template-columns:1fr;gap:7px}.research-mark{min-height:14px}}
@media(max-width:700px){.case-documents{grid-template-columns:1fr}.case-paper{padding:14px}.case-paper p{font-size:18px}.research-form{padding:12px}.research-row{padding:13px 5px}.research-row label{font-size:18px}}
</style>

ry, he will be arrested tomorrow. In the broken timeline, a modern device will stop the guards from finding him.","objective":"Search the cellar. Identify the engineer and uncover the device’s secret.","interlude":"The gear goes silent. A hidden signal from the Meridian Order flashes: “THE LETTER IS STILL MISSING.”","tasks":[{"id":"e1","type":"hotspots","title":"Look carefully","lead":"Find all FOUR marked objects. Each one tells you something about the room.","hints":["Two objects belong to the seventeenth century, but the silver gear does not.","Check all four glowing markers, including the lower corners."],"image":"cellar","spots":[{"x":24,"y":48,"label":"Barrels","text":"The barrels are part of the real 1605 plot, not a modern object."},{"x":73,"y":80,"label":"Lantern","text":"The lantern belongs to this century. The flame is real."},{"x":63,"y":32,"label":"Silver gear","text":"A strange metal gear has a silver raven and two letters: N. V."},{"x":15,"y":84,"label":"Folded paper","text":"A paper says: “The engineer can stop the search with a single signal.”"}]},{"id":"e2","type":"code","title":"The three-letter shift","lead":"A note contains “QRUD”. Each letter was moved THREE places FORWARD in the alphabet. Move each letter THREE places BACK to read a first name. Example: FDW → CAT.","hints":["Q moves back to N. R moves back to O.","The four letters become N–O–R–A."],"placeholder":"Decoded first name","maxLength":12},{"id":"e3","type":"dialogue","title":"Talk to Guy Fawkes","lead":"You can ask questions, but do not reveal your identity.","hints":["Pretend to work for Percy; Fawkes uses Percy’s servant identity.","Ask for the woman’s surname. You already know her first name."],"steps":[{"prompt":"Guy Fawkes: “Who sent you here?”","options":["I want to check the firewood for Percy.","I am the future police.","You have already been arrested."],"wrong":"Guy Fawkes looks suspicious. “That cannot be true.”"},{"prompt":"Guy Fawkes: “A strange woman was here. Why do you ear sentence.","hints":["Start with an instruction: “Stay away...”","Complete the place, then the date: “from Parliament on the fifth of November.”"],"items":["from Parliament","of November.","Stay away","on the fifth"]},{"id":"f2","type":"code","title":"When did the real letter arrive?","lead":"Use your original timeline notes. Enter the exact historical date when Lord Monteagle received the letter (day, month, year).","hints":["The letter came in October, more than a week before the planned attack.","Check the timeline: 26 October 1605."],"placeholder":"e.g. 12 March 1605"},{"id":"f4","type":"packet","title":"The four sealed packets","lead":"The Meridian Order has left FOUR packets. Only one matches the evidence from the tavern, Percy’s doorway and the cellar. Compare the wax seal, thread colour and gear number. Which packet contains the real warning?","hints":["Find the Signal trail tab in your evidence file. Three different people helped you discover the signs.","A correct packet must have the same WAX MARK as the tavern, the same THREAD COLOUR as Percy’s doorway and the same GEAR NUMBER as the cellar."]},{"id":"f3","type":"dialogue","title":"Speak to Lord Monteagle","lead":"Warn him without explaining time travel.","hints":["Talk about the important letter first.","The King’s leading minister was Robert Cecil."],"steps":[{"prompt":"Monteagle: “Why do you need to speak to me?”","options":["Your horse is very beautiful.","You were supposed to receive an important warning.","I work for the Meridian Order."],"wrong":"Monteagle: “I do not understand. Speak clearly.”"},{"prompt":"Monteagle: “If the danger is real, what should I do?”","options":["Keep the letter secret forever.","Give the warning to Robert Cecil.","Tell Guy Fawkes to hurry."],"wrong":"Monteagle: “That does not sound safe. Who can help the government?”"}]},{"id":"x10","type":"investigation","title":"The broken delivery chain","lead":"Investigate when the anonymous warning should arrive and where it was   <script>
/* The Gunpowder Paradox — extended investigative offline-first GitHub Pages game.
   Historical people/events are real; the Meridian Order and its agents are fictional.
   Rewards are encrypted in data.js and unlocked by student answers. Do NOT deploy the teacher guide.
*/
(() => {
'use strict';
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const STORAGE = 'gunpowder-paradox-1605-detective-v2';
const TEXT_STORAGE = 'gunpowder-paradox-readable-text';
let textSize = 1; // Large type is the default on iPads.
try { const saved = localStorage.getItem(TEXT_STORAGE); if (saved !== null) textSize = Math.max(0,Math.min(2,Number(saved)||0)); } catch {}
document.documentElement.dataset.textSize=String(textSize);
function updateTextControls(){document.querySelectorAll('[data-action=text-smaller]').forEach(b=>b.disabled=textSize===0);document.querySelectorAll('[data-action=text-larger]').forEach(b=>b.disabled=textSize===2);}

const total = CHAPTERS.reduce((n,c)=>n+c.tasks.length,0);
const taskMap = new Map(CHAPTERS.flatMap(c => c.tasks.map(t => [t.id,t])));
const ESC = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]/g,'');
// Every new mission gets a fresh trail. Its clues must be reconstructed from
// different scenes; there is no universal student answer to the new puzzles.
const SIGN_POOL=['STAR','MOON','KEY','CROWN','ROSE','SUN','TREE','DIAMOND'];
const THREADS=['BLUE','GREEN','GOLD','PURPLE'];
const GEARS=['3','5','7','9'];
function randomIndex(n){
  if (globalThis.crypto?.getRandomValues){const b=new Uint32Array(1);crypto.getRandomValues(b);return b[0]%n;}
  return Math.floor(Math.random()*n);
}
function shuffled(xs){const a=xs.slice();for(let i=a.length-1;i>0;i--){const j=randomIndex(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function newProfile(){
  return {symbols:shuffled(SIGN_POOL).slice(0,4),digits:shuffled([2,3,4,5,6,7,8,9]).slice(0,4),thread:THREADS[randomIndex(THREADS.length)],gear:GEARS[randomIndex(GEARS.length)],packetOrder:shuffled([0,1,2,3])};
}
function signalClue(taskId){
  const p=state.profile, [a,b,c,d]=p.symbols;
  const decoder=p.symbols.map((symbol,i)=>({symbol,digit:p.digits[i]})).sort((x,y)=>x.symbol.localeCompare(y.symbol));
  if(decoder.every((entry,i)=>entry.symbol===p.symbols[i])) decoder.reverse();
  const messages={
    c3:['Tavern decoder',`A hidden wax mark reads ${a}. The packet you need has the SAME wax mark. The cipher card lists the symbols in a DIFFERENT order: ${decoder.map(e=>e.symbol+' = '+e.digit).join(' · ')}.`],
    d1:['Percy’s doorway',`The doorway mark is ${b}. A servant saw the stolen warning packet tied with ${p.thread} thread. This thread is NOT the courier’s grey ribbon.`],
    e1:['Cellar device',`The cellar mark is ${c}. The modern gear hiding the cellar is stamped with the number ${p.gear}.`],
    g1:['Royal court marker',`The royal court mark is ${d}. To open the time gate, read the four location symbols in journey order: TAVERN → PERCY’S DOORWAY → CELLAR → ROYAL COURT.`]
  };
  if(!messages[taskId])return null;
  return {id:taskId+'-signal',chapter:({c3:2,d1:3,e1:4,g1:6})[taskId],title:messages[taskId][0],body:messages[taskId][1],kind:'signal'};
}
function packetOptions(){
  const p=state.profile;
  const main={mark:p.symbols[0],thread:p.thread,gear:p.gear};
  const wrongMark=SIGN_POOL.find(s=>s!==main.mark);
  const wrongThread=THREADS.find(s=>s!==main.thread);
  const wrongGear=GEARS.find(s=>s!==main.gear);
  const opts=[main,{...main,mark:wrongMark},{...main,thread:wrongThread},{...main,gear:wrongGear}];
  return p.packetOrder.map(i=>opts[i]);
}
const empty = () => ({started:false,chapter:0,solved:{},entries:[],hints:{},interactions:{},notes:'',tab:'clues',elapsedMs:0,won:false,profile:newProfile()});
let state;
try { state = {...empty(),...JSON.parse(localStorage.getItem(STORAGE) || '{}')}; } catch {state=empty();}
if (!state.solved || !state.interactions || !Array.isArray(state.entries)) state=empty();
// Seamlessly migrate saved progress from the older 27-puzzle version.
if (!state.profile || !Array.isArray(state.profile.packetOrder)) state.profile=newProfile();
if (state.won && !state.solved.h0){state.won=false;delete state.solved.h3;state.chapter=5;}
if (state.chapter>5 && !state.solved.f4)state.chapter=5;
for (const k of ['c3','d1','e1','g1']){
  if(state.solved[k] && !state.entries.some(e=>e.id===k+'-signal')){
    const trace=signalClue(k); if(trace)state.entries.push(trace);
  }
}
let sessionStart=Date.now();
let openNotebook=false;
let caseOpener=null;
let busy=false;
const feedback={};
let toastTimer;
function save(){ try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{} }

function announce(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),3200);}

function badge(txt){return `<span class="location">${ESC(txt)}</span>`;}
async function unlock(id, answer){
  const e=VAULT[id]; if (!e || !crypto?.subtle) return null;
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  try {
    const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(answer)),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:24000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.n),additionalData:new TextEncoder().encode(id)},key,b64(e.v));
    return JSON.parse(new TextDecoder().decode(decrypted));
  } catch{return null;}
}
function complete(t, data){
  if (state.solved[t.id]) return;
  const info=data?.reward || {title:'Clue collected',body:'This task is finished.',kind:'clue'};
  state.solved[t.id]=info;
  state.entries.push({id:t.id,chapter:state.chapter,...info});
  const trace=signalClue(t.id);
  if(trace)state.entries.push(trace);
  delete feedback[t.id];
  save(); announce(trace?'New signal found — check Signal trail':'Evidence collected — '+info.title);
  render(true);
}

async function doCheck(t,candidate){
 if(busy)return;
 busy=true;
 try{
   const response=await unlock(t.id,candidate);
   if(response){complete(t,response);}else{feedback[t.id]='That does not match the evidence yet. Check the text, try another order or open a hint.'; render(true);}
 }finally{busy=false;}
}
async function doDialogue(t,chosen){
 if(busy)return;busy=true;
 try{
  const u=getInter(t); const step=u.step||0;
  const response=await unlock(t.id+':'+step,chosen);
  if(!response){feedback[t.id]=t.steps[step].wrong;render(true);return;}
  delete feedback[t.id];
  u.replies=[...(u.replies||[]),response.reply];u.step=step+1;
  if(response.reward){complete(t,response);}else{save();render(true);announce('The witness trusts you. Ask another question.');}
 }finally{busy=false;}
}
async function doHotspot(t,pos){
 const u=getInter(t); const s=t.spots[pos];
 u.found ||= [];
 u.spotText=s.text;
 if(!u.found.includes(pos))u.found.push(pos);
 save();
 if(u.found.length===t.spots.length){const response=await unlock(t.id,u.found.sort((a,b)=>a-b).join(','));if(response){complete(t,response);return;}}
 render(true);
}

 if(busy)return;busy=true;
 try{
  const u=getInter(t);
  const fields=[...form.querySelectorAll('[data-finalfield]')].map(x=>x.value.trim());
  const action=form.querySelector('#final-action').value;
  u.fields=fields;u.action=action;
  u.valid=await Promise.all(fields.map(async(x,i)=>!!(x&&await unlock(t.id+':f'+i,x))));
  if(!state.solved.h0 || CHAPTERS[7].tasks.some(x=>x.id!==t.id&&!state.solved[x.id])){feedback[t.id]='Finish the research dossier and unlock your personal time gate first.';render(true);return;}
  if(u.valid.every(Boolean)){
    const response=await unlock(t.id+':action',action);
    if(response){complete(t,response);state.won=true;save();window.scrollTo(0,0);render();announce('You did it. History is restored!');return;}
    feedback[t.id]='All six facts are correct! Check your final action.';
  } else {
    const failed=u.valid.map((isOk,i)=>!isOk?i+1:0).filter(Boolean);
    feedback[t.id]='Check field'+(failed.length>1?'s ':' ')+failed.join(', ')+'. Correct fields have a ✓.';
  }
  save();render(true);
 }finally{busy=false;}
}
async function checkInvestigation(t,form){
 if(busy)return;busy=true;
 try{
   const u=getInter(t);
   const vals=[...form.querySelectorAll('[data-research]')].map(el=>el.value.trim());
   u.values=vals;
   const hex=bytes=>Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join('');
   const checks=[];
   for(let i=0;i<t.questions.length;i++){
     const q=t.questions[i];
     const raw=norm(vals[i]);
     if(!raw){checks.push(false);continue;}
     const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(q.salt+'|'+raw)));
     checks.push(q.hashes.includes(digest));
   }
   u.checked=checks;save();
   if(checks.every(Boolean)){
     complete(t,{reward:t.reward});
   }else{
     const right=checks.filter(Boolean).length;
     feedback[t.id]=right+' of '+checks.length+' answers correct. Read the documents again and correct the highlighted answers.';
     render(true);
   }
 }finally{busy=false;}
}

async function submitTask(t,form){
 if(t.type==='investigation'){await checkInvestigation(t,form);return;}
 if(t.type==='final'){await submitFinal(t,form);return;}
 if(t.type==='signal'){
  const code=form.querySelector('[name=code]').value.trim();
  if(code===state.profile.digits.join('') && state.solved.f4 && state.solved.g1){
   complete(t,{reward:{title:'Personal time gate unlocked',body:'Your four symbols and decoder opened the time gate. There is no universal code for this mission.',kind:'signal-solved'}});
  }else{feedback[t.id]='The code is not correct yet. Check your four markers and the tavern decoder in Signal trail.';render(true);}
  return;
 }
 let candidate;
 if(t.type==='choice'||t.type==='multi'){
  const selected=[...form.querySelectorAll('input:checked')].map(x=>Number(x.value));
  if(!selected.length){feedback[t.id]='Choose an answer first.';render(true);return;}
  candidate=t.type==='multi'?selected.sort((a,b)=>a-b).join(','):String(selected[0]);
 }else if(t.type==='match'){
  const vals=[...form.querySelectorAll('[data-match]')].map(x=>x.value);
  if(vals.includes('')){feedback[t.id]='Choose an answer for every row.';render(true);return;}
  candidate=vals.join(',');
 }else if(t.type==='code'){
  candidate=form.querySelector('[name=code]').value.trim();
  if(!candidate){feedback[t.id]='Type your answer first.';render(true);return;}
 } else return;
 await doCheck(t,candidate);
}
async function doClick(event){
 const btn=event.target.closest('button[data-action]');if(!btn)return;
 const action=btn.dataset.action;
 if(action==='text-smaller'||action==='text-larger'){
  textSize=Math.max(0,Math.min(2,textSize+(action==='text-larger'?1:-1)));
  document.documentElement.dataset.textSize=String(textSize);
  try{localStorage.setItem(TEXT_STORAGE,String(textSize));}catch{}
  updateTextControls();
  return;
 }
 if(action==='begin'){state.started=true;sessionStart=Date.now();save();render();window.scrollTo(0,0);return;}
 if(action==='restart'){
  if(!confirm('Start a NEW mission? Your current evidence and notes will be erased on this device.'))return;
  state=empty();sessionStart=Date.now();openNotebook=false;save();render();window.scrollTo(0,0);return;
 }
 if(action==='notebook'){
  if(!openNotebook){caseOpener=btn;openNotebook=true;}
  else{openNotebook=false;}
  render(true);
  if(!openNotebook)requestAnimationFrame(()=>{
   const opener=app.querySelector('.case-fab') || app.querySelector('.case-top-button');opener?.focus({preventScroll:true});
  });
  return;
 }
 if(action==='close-overlay'){openNotebook=false;render(true);return;}
 if(action==='tab'){state.tab=btn.dataset.tab;save();render(true);return;}
 if(action==='copy'){
  const text='THE GUNPOWDER PARADOX / CASE FILE\n\n'+state.entries.map(e=>e.title+': '+e.body).join('\n')+'\n\nMY NOTES\n'+state.notes;
  try{await navigator.clipboard.writeText(text);announce('Case notes copied!');}catch{announce('Copy was blocked. You can select and copy your notes manually.');}return;
 }
 if(action==='next'){
  const sec=CHAPTERS[state.chapter];if(!sec.tasks.every(t=>state.solved[t.id]))return;
  if(state.chapter<CHAPTERS.length-1){state.chapter++;save();render();window.scrollTo({top:0,behavior:'instant'});}else{state.won=true;save();render();}
  return;
 }
 const t=taskMap.get(btn.dataset.task);if(!t||state.solved[t.id])return;
 if(t.type==='final'&&!state.solved.h0){announce('Unlock the personal time gate before completing your report.');return;}
 if(action==='hint'){
  state.hints[t.id]=Math.min(t.hints.length,(state.hints[t.id]||0)+1);save();render(true);return;
 }
 if(action==='check'){
  const u=getInter(t);
  const candidate=t.type==='classify'?(u.categories||[]).join(','):(u.order||t.items.map((_,i)=>i)).join(',');
  if(t.type==='classify'&&(u.categories||[]).length!==t.items.length){feedback[t.id]='Select a category for every statement.';render(true);return;}
  await doCheck(t,candidate);return;
 }
 if(action==='packet'){
  if(Number(btn.dataset.choice)===state.profile.packetOrder.indexOf(0) && ['c3','d1','e1'].every(k=>state.solved[k])){
    complete(t,{reward:{title:'The warning packet found',body:'The wax mark, thread and gear number agree. The real warning can now be delivered to Lord Monteagle.',kind:'clue'}});
  }else{feedback[t.id]='One or more details do not match. Compare the three earlier scenes in Signal trail.';render(true);}
  return;
 }
 if(action==='dialogue'){await doDialogue(t,btn.dataset.choice);return;}
 if(action==='spot'){await doHotspot(t,Number(btn.dataset.spot));return;}
 if(action==='classify'){
  const u=getInter(t);u.categories||=[];u.categories[Number(btn.dataset.row)]=Number(btn.dataset.choice);delete feedback[t.id];save();render(true);return;
 }
 if(action==='move'){
  const u=getInter(t);u.order ||=t.items.map((_,i)=>i);
  const src=Number(btn.dataset.pos),dst=src+Number(btn.dataset.dir);
  if(dst<0||dst>=u.order.length)return;
  [u.order[src],u.order[dst]]=[u.order[dst],u.order[src]];delete feedback[t.id];save();render(true);return;
 }
}
app.addEventListener('click',e=>{if(e.target.classList.contains('case-overlay')){openNotebook=false;render(true);return;}doClick(e).catch(err=>{console.error(err);announce('Something went wrong. Reload to continue from your saved place.');});});
app.addEventListener('submit',e=>{const form=e.target.closest('form[data-taskform]');if(!form)return;e.preventDefault();const t=taskMap.get(form.dataset.taskform);if(t)submitTask(t,form).catch(err=>{console.error(err);announce('Could not check this answer. Please reload.');});});
app.addEventListener('input',e=>{if(e.target.id==='notepad'){state.notes=e.target.value;save();}});
document.addEventListener('keydown',e=>{
 if(!openNotebook)return;
 if(e.key==='Escape'){e.preventDefault();openNotebook=false;render(true);app.querySelector('.case-fab')?.focus({preventScroll:true});return;}
 if(e.key==='Tab'){
  const choices=[...app.querySelectorAll('.case-dialog button:not(:disabled),.case-dialog textarea:not(:disabled)')];
  if(!choices.length)return;
  const first=choices[0],last=choices[choices.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});
let dragging=null;
app.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag-task]');if(!el)return;dragging={id:el.dataset.dragTask,pos:Number(el.dataset.pos)};e.dataTransfer.effectAllowed='move';});
app.addEventListener('dragover',e=>{const el=e.target.closest('[data-drag-task]');if(el&&dragging&&el.dataset.dragTask===dragging.id)e.preventDefault();});
app.addEventListener('drop',e=>{const el=e.target.closest('[data-drag-task]');if(!dragging||!el||el.dataset.dragTask!==dragging.id)return;e.preventDefault();const t=taskMap.get(dragging.id),u=getInter(t);u.order||=t.items.map((_,i)=>i);let [element]=u.order.splice(dragging.pos,1);u.order.splice(Number(el.dataset.pos),0,element);dragging=null;save();render(true);});
window.addEventListener('beforeunload',()=>{state.elapsedMs=elapsed();sessionStart=Date.now();save();});
setInterval(()=>{if(!state.started)return;const el=document.getElementById('time');if(el)el.textContent=clock();},1000);
if(!window.crypto?.subtle){console.warn('Crypto unavailable. GitHub Pages uses HTTPS and provides it.');}
render();
})();

  </script>
