radius:10px;background:#fff;color:#0e2436;font-size:var(--font);font-weight:600}.question select{font-weight:500}.options{display:grid;gap:9px}.option{border:2px solid #5e829d;border-radius:12px;min-height:51px;padding:12px 13px;background:#143b56;color:#fff;text-align:left}.option.on{border-color:#ffd694;background:#2a566e}.qresult{display:block;font-size:15px;min-height:0;margin-top:7px}.qresult.good{color:var(--mint)}.qresult.bad{color:#ffc2b6}.qresult:empty{display:none}.chipbank{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chipword{border:1px solid #7194ae;border-radius:10px;background:#1d4a68;color:#fff;padding:9px 12px;min-height:46px}.chipword.used{background:#fdc188;color:#13283a}.sentence{padding:11px;border:1px dashed #8babbb;border-radius:10px;min-height:52px;margin:9px 0;background:#081c2e}.bottomarea{border-top:1px solid #385f7c;margin-top:18px;padding-top:17px}.bottomarea .btn{width:100%;font-size:20px;min-height:59px}.subnote{font-size:15px;color:#d0e1ee;margin-top:10px}.hintbox,.success{border-radius:13px;padding:16px;margin-top:14px;border:1px solid #ad9663;background:#3e352d}.hintbox{color:#ffe5b7}.success{border-color:#77c8ab;background:#123c39;color:#b4efcf}.success strong{font-size:25px}.feedback{font-weight:700;margin:9px 0;color:#ffd8bf}.footer{padding:25px 0;text-align:center;font-size:14px;color:#a9c6d9}

'use strict';
const SCENES=[{"title":"MISSION CONTROL","location":"EngliForce HQ · 08:00","image":1,"intro":"A student is missing from the school computer. Three files have changed. Find the real information before the Copycat deletes everything.","files":[["Welcome message","Hello! I am twelve years old. I have got one brother. His name is Ben. My best friend is Noah. I love English and volleyball."],["Student cards","A. Maya Carter — 12 — brother Ben — friend Noah.\nB. Mia Wilson — 13 — sister Lily — friend Ruby.\nC. Molly Parker — 12 — brother Jack — friend Theo."],["Agent instruction","The Copycat has copied a name, but not the whole story. Check EVERY fact. Do not choose a file after reading only one line."]],"groups":[{"title":"Three possible identities","lead":"Compare the welcome message with the three student cards.","items":[{"q":"Which card matches ALL the facts?","type":"select","options":["Card A","Card B","Card C"],"hint":"","id":"s1g1q1","dyn":false,"checks":["f7afbec03a3c83545925"]},{"q":"Write the student’s first name.","type":"text","hint":"","placeholder":"Write your answer","id":"s1g1q2","dyn":false,"checks":["52be322a9c1a1a6333a9"]},{"q":"Write the student’s surname.","type":"text","hint":"","placeholder":"Write your answer","id":"s1g1q3","dyn":false,"checks":["45586218fc1aa2d47e6b"]},{"q":"Why is Card C wrong?","type":"select","options":["Her brother has a different name.","She is too old.","She has got a sister."],"hint":"","id":"s1g1q4","dyn":false,"checks":["4812eb896d2ffcd60bb8"]}],"skill":"Reading for detail","bonus":""},{"title":"A message with mistakes","lead":"The Copycat has sent another message. Repair its English: \"my name are maya. i is twelve. he are my brother.\"","items":[{"q":"Build the first correct sentence. Tap the words in order.","type":"order","words":["Maya.","is","name","My"],"hint":"Start with My; a name begins with a capital.","id":"s1g2q1","dyn":false,"checks":["cf8f0eb52896f553a6a5"]},{"q":"Choose the correct second sentence.","type":"select","options":["i are twelve.","I am twelve.","I is twelve."],"hint":"","id":"s1g2q2","dyn":false,"checks":["ddae26fea860282c992f"]},{"q":"Choose the correct last sentence.","type":"select","options":["He is my brother.","His are my brother.","He am my brother."],"hint":"","id":"s1g2q3","dyn":false,"checks":["6bdcc77f972b4946fce4"]},{"q":"How many capital letters does \"My name is Maya.\" need?","type":"text","hint":"One at the start and one for a name.","placeholder":"Write your answer","id":"s1g2q4","dyn":false,"checks":["b06de5299a8ca033a1e6"]}],"skill":"To be + capital letters","bonus":""},{"title":"The first access code","lead":"The real student has got four letters in her first name. Use the alphabet: M = 13, A = 1, Y = 25, A = 1.","items":[{"q":"What is the 13th letter of the alphabet?","type":"text","hint":"","placeholder":"Write your answer","id":"s1g3q1","dyn":false,"checks":["7ef1150836bfb39ac794"]},{"q":"Which letter is number 25?","type":"text","hint":"","placeholder":"Write your answer","id":"s1g3q2","dyn":false,"checks":["abb8fa09f668ecab60e5"]},{"q":"Write the FIRST and LAST letters of Maya together.","type":"text","hint":"","placeholder":"Write your answer","id":"s1g3q3","dyn":false,"checks":["c376ffec5c720db880f5"]},{"q":"How many letters are in CARTER?","type":"text","hint":"","placeholder":"Write your answer","id":"s1g3q4","dyn":false,"checks":["17666ee7f70bde586a41"]},{"q":"What have you proved?","type":"select","options":["One card matches all the facts.","All three cards are correct.","The student is thirteen."],"hint":"","id":"s1g3q5","dyn":false,"checks":["90222cc2a5b4f3d18afe"]}],"skill":"Alphabet + reasoning","bonus":""}],"clue":"Your first result: the real pupil is <b>Maya Carter</b>. A second file could still be fake. Keep investigating."},{"title":"THE LOCKER CORRIDOR","location":"School · 08:12","image":2,"intro":"The caretaker has found a blue bag and two orange envelopes. One belongs to Maya. The other is a trick.","files":[["Locker list","Maya Carter — locker 18.\nMia Wilson — locker 28.\nNoah Green — locker 14.\nTheo Brown — locker 21."],["Envelope A","To: Maya Carter. From: Noah.\nI have got your blue pencil case. It is in my locker. See you at break!"],["Envelope B","To: Mia Wilson. From: Ruby.\nI have got your red school bag. It is next to my green coat."],["Security log","The Copycat entered the corridor at 08:10. The keycard was {colour}. The camera did not show a face."]],"groups":[{"title":"Two envelopes","lead":"Compare both letters with the school records.","items":[{"q":"Which envelope is for Maya?","type":"select","options":["A","B"],"hint":"","id":"s2g1q1","dyn":false,"checks":["2e23cce6f090ca5289f9"]},{"q":"Who has got Maya’s pencil case?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g1q2","dyn":false,"checks":["10e3f365f53e4c8d380a"]},{"q":"What colour is Mia’s school bag?","type":"select","options":["Blue","Red","Green"],"hint":"","id":"s2g1q3","dyn":false,"checks":["f68e3101065903639d96"]},{"q":"What is Maya’s locker number?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g1q4","dyn":false,"checks":["b79bbbd390635013759b"]}],"skill":"Reading + have got","bonus":""},{"title":"Check the locker numbers","lead":"Use the locker list and do not confuse the people.","items":[{"q":"What is Noah’s locker number?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g2q1","dyn":false,"checks":["54803ea0f28126166f17"]},{"q":"What is Mia’s locker number?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g2q2","dyn":false,"checks":["0492533bce91080d098f"]},{"q":"What number is FOUR after Maya’s locker?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g2q3","dyn":false,"checks":["8dbc681bc81685c82644"]},{"q":"Which sentence is correct?","type":"select","options":["Noah has got Maya’s pencil case.","Mia has got Maya’s pencil case.","Theo has got Maya’s pencil case."],"hint":"","id":"s2g2q4","dyn":false,"checks":["f699aef9252ab66d8116"]}],"skill":"Numbers + inference","bonus":""},{"title":"The keycard mystery","lead":"The security camera saw a keycard, but not its owner. Keep the colour in your Evidence File.","items":[{"q":"Which question asks about colour?","type":"select","options":["What colour is the keycard?","How old is the keycard?","Who colour is the keycard?"],"hint":"","id":"s2g3q1","dyn":false,"checks":["1dcb41c1626ba956015c"]},{"q":"Which word completes: \"I ___ got a bag\"?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g3q2","dyn":false,"checks":["4da233c1bc5d7af3ed3b"]},{"q":"Which word completes: \"She ___ got a bag\"?","type":"text","hint":"","placeholder":"Write your answer","id":"s2g3q3","dyn":false,"checks":["f5e75ded7db69faee6de"]},{"q":"What should you do with one security clue?","type":"select","options":["Keep it and look for more evidence.","Choose a suspect immediately.","Ignore all other information."],"hint":"","id":"s2g3q4","dyn":false,"checks":["ef90d42ed12331ed6fcb"]}],"skill":"Question words + reasoning","bonus":""}],"clue":"The Copycat used a <b>{colour}</b> keycard. Maya’s own locker is <b>18</b>."},{"title":"AT MAYA’S HOME","location":"Family house · 08:25","image":3,"intro":"Maya’s brother is waiting. Somebody has sent a fake family message. Compare the photographs, the family tree and the messages.","files":[["Family photograph","This is Maya with her mum, her dad and her brother Ben. Their dog is called Biscuit. Maya has got a blue backpack. Ben has got a red bike."],["Ben’s message","Hi! My name is Ben Carter. I am ten years old. Maya is my sister. I have got a red bike. Our dog Biscuit is small and brown."],["Two messages","REAL: \"My sister is Maya. She is twelve. Our dog is Biscuit.\"\nFAKE: \"My brother is Maya. He is thirteen. Our cat is Biscuit.\""]],"groups":[{"title":"Read the family photograph","lead":"Use both the photograph description and Ben’s message.","items":[{"q":"What is Maya’s br function random(n){try{let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let n=random(i+1);[a[i],a[n]]=[a[n],a[i]]}return a}
function fresh(){return {started:false,step:0,checkpoint:0,font:0,hints:0,notes:'',draft:{},suspects:shuffle([0,1,2,3,4,5,6,7]),culprit:random(8),signals:shuffle(SIGNS),digits:shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4),startTime:null,completedAt:null};}
let st;try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!st||!st.signals||!Array.isArray(st.suspects))st=fresh();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function e(s){return String(s).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function normDyn(s){return String(s).toLowerCase().replace(/[\s.,!?;:'"-]/g,'')}
function suspectName(){return NAMES[st.suspects.indexOf(st.culprit)]}
function culprit(){return TRAITS[st.culprit]}
function code(){return st.signals.map(x=>st.digits[SIGNS.indexOf(x)]).join('')}
function interpolate(t){const c=culprit(),d=st.signals.map(x=>st.digits[SIGNS.indexOf(x)]);return String(t).replace(/\{(colour|symbol|locker|suspect|d1|d2|d3|d4|code)\}/g,(_,key)=>({colour:c.colour,symbol:c.symbol,locker:c.locker,suspect:suspectName(),d1:d[0],d2:d[1],d3:d[2],d4:d[3],code:code()})[key]);}
function markDone(n){return st.step>=(n+1)*3}
function sceneIndex(){return Math.min(SCENES.length-1,Math.floor(st.step/3))}
function groupIndex(){return st.step%3}
function titleScene(s){return `<div class="section-header"><div><div class="eyebrow">MISSION ${sceneIndex()+1} / ${SCENES.length} · ${e(s.location)}</div><h1>${e(s.title)}</h1></div><div class="pillrow"><span class="pill">${st.step} of ${TOTAL} cases</span><span class="pill">A1 / A1+ English</span></div></div>`}
function gotoTop(){window.scrollTo({top:0,behavior:'instant'})}
function render(){document.documentElement.style.setProperty('--font',(19+st.font*2)+'px');$('progressBar').style.width=Math.round(st.step/TOTAL*100)+'%';const started=st.started&&st.step<TOTAL;$('floating').classList.toggle('hidden',!started);$('openEvidence').disabled=!st.started;
 if(!st.started){intro();return}if(st.step>=TOTAL){victory();return}
 if(st.step>0&&st.step%3===0&&st.checkpoint!==st.step){checkpoint();return}screen();}

let activeDoc=0,activeEvidence='clues',returnFocus=null;
function getGroup(){return SCENES[sceneIndex()].groups[groupIndex()]}

 let b=$('doclist');s.files.forEach((f,i)=>{let el=document.createElement('button');el.className='docbtn';el.textContent=`FILE ${i+1}`;el.onclick=()=>showDoc(i);b.appendChild(el)});showDoc(0);renderQuestions(g);$('checkCase').onclick=checkAll;$('hintBtn').onclick=()=>{st.hints++;persist();let hints=g.items.map((x,i)=>`<div><b>${i+1}.</b> ${e(x.hint||'Read all the documents and compare the information.')}</div>`).join('');$('hintPanel').innerHTML=hints;$('hintPanel').classList.remove('hidden');$('hintBtn').disabled=true};gotoTop()}

function renderQuestions(g){$('questions').innerHTML=g.items.map((q,i)=>{let saved=st.draft[q.id]||'';let answerHTML='';if(q.type==='select'){answerHTML=`<div class="options" role="group" aria-label="${e(q.q)}">${q.options.map(opt=>`<button type="button" class="option ${saved===opt?'on':''}" data-choice="${e(opt)}" data-q="${q.id}" aria-pressed="${saved===opt}">${e(opt)}</button>`).join('')}</div>`}else if(q.type==='order'){answerHTML=`<div class="chipbank">${shuffle(q.words).map(w=>`<button type="button" class="chipword" data-word="${e(w)}" data-q="${q.id}">${e(w)}</button>`).join('')}</div><div class="sentence" id="sent_${q.id}">${saved?e(saved):'Tap the words in the correct order…'}</div><button class="btn small" type="button" data-clear="${q.id}">CLEAR WORDS</button>`}else{answerHTML=`<input autocomplete="off" spellcheck="false" data-text="${q.id}" value="${e(saved)}" placeholder="${e(q.placeholder||'Write the missing word or number')}" aria-label="${e(q.q)}">`};return `<div class="question" id="wrap_${q.id}"><label>${i+1}. ${e(q.q)}</label>${answerHTML}<span class="qresult" id="result_${q.id}"></span></div>`}).join('');
 $('questions').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let id=b.dataset.q;st.draft[id]=b.dataset.choice;persist();$('questions').querySelectorAll(`[data-choice][data-q="${id}"]`).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))})});

 $('questions').querySelectorAll('[data-word]').forEach(b=>{const tokens=String(st.draft[b.dataset.q]||'').split(' ');const w=b.dataset.word;if(tokens.includes(w)){b.disabled=true;b.classList.add('used')}});

async function sha(s,id){let data=new TextEncoder().encode(`${id}|englife2-${norm(s)}`);let hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20)}
async function valid(q,value){if(q.dyn){return normDyn(value)===normDyn(interpolate(q.expected))}let hashed=await sha(value,q.id);return q.checks.includes(hashed)}
let checking=false;
async function checkAll(){if(checking)return;checking=true;let g=getGroup(),bad=0,missing=0;for(let q of g.items){let value=st.draft[q.id]||'';const res=$('result_'+q.id);if(!String(value).trim()){missing++;res.textContent='Please answer this first.';res.className='qresult bad';continue}let ok=false;try{ok=await valid(q,value)}catch(err){res.textContent='Open this game using GitHub Pages or Safari.';res.className='qresult bad';bad++;continue}res.textContent=ok?'✓ Correct': 'Not yet — compare the documents again.';res.className='qresult '+(ok?'good':'bad');$('wrap_'+q.id).style.borderLeft=ok?'3px solid #8cd9ba':'3px solid #f5ac91';if(!ok)bad++}checking=false;if(missing||bad){$('formFeedback').textContent=`${g.items.length-bad-missing} of ${g.items.length} correct. Fix ${bad+missing} answer${bad+missing!==1?'s':''}.`;return}
 $('formFeedback').textContent='';$('questions').innerHTML=`<div class="success"><strong>✓ INVESTIGATION COMPLETE!</strong><p>You checked every answer. ${st.step%3===2?'A new piece of evidence is ready.':'Continue to the next investigation.'}</p><button id="continue" class="btn primary" style="width:100%;font-size:21px;min-height:60px">CONTINUE →</button></div>`;$('checkCase').classList.add('hidden');$('hintBtn').classList.add('hidden');$('continue').onclick=()=>{st.step++;st.draft={};persist();render()}}
function checkpoint(){let n=Math.floor(st.step/3)-1,s=SCENES[n],signal=n<4?st.signals[n]:null;root.innerHTML=`<section class="checkpoint"><img src="${IMAGES[String(s.image)]}" alt="Location completed"><div class="inside"><div class="eyebrow">MISSION ${n+1} COMPLETE · 3 INVESTIGATIONS SOLVED</div><h1>NEW EVIDENCE FOUND!</h1><div class="clue">${interpolate(s.clue)}</div>${signal?`<div class="clue"><b>PERSONAL SIGNAL SYMBOL</b><p style="font-size:39px;margin:4px 0;color:var(--gold)">${signal}</p>Mission ${n+1} of 4. Keep this symbol in your Evidence File for the final vault.</div>`:''}<p>Read your evidence before moving on. The next mission has more information.</p><button id="continueMission" class="btn primary" style="font-size:20px;min-height:60px">NEXT LOCATION →</button> <button id="evidenceCheckpoint" class="btn">OPEN EVIDENCE</button></div></section>`;$('continueMission').onclick=()=>{st.checkpoint=st.step;persist();render()};$('evidenceCheckpoint').onclick=()=>openEvidence('clues');gotoTop()}
function vaultDecoder(){return `<div class="document" style="margin:14px 0"><h3>YOUR PERSONAL DECODER</h3><div class="decoder">${SIGNS.map((symbol,i)=>`<div><strong>${symbol}</strong>${st.digits[i]}</div>`).join('')}</div><p style="font-size:15px;margin-top:10px">Use the symbol order: HQ → LOCKERS → HOME → PLAYGROUND. The number is different in every game.</p></div>`}
function winTime(){if(!st.completedAt){st.completedAt=Date.now();persist()}let diff=st.startTime?Math.max(1,Math.round((st.completedAt-st.startTime)/60000)):null;return diff}
function victory(){let mins=winTime();root.innerHTML=`<section class="checkpoint"><img src="${IMAGES['6']}" alt="The identity vault is open"><div class="inside"><div class="eyebrow">FINAL REPORT · ${TOTAL} / ${TOTAL} INVESTIGATIONS</div><h1>IDENTITY RESTORED!</h1><p>You compared witnesses, repaired the school documents and opened the vault. The mystery is solved.</p><div class="resultgrid"><div>REAL STUDENT<b>Maya Carter</b></div><div>THE COPYCAT<b>${e(suspectName())}</b></div><div>QUESTIONS SOLVED<b>124 / 124</b></div><div>HINTS USED<b>${st.hints}</b></div></div>${mins?`<div class="clue">Your detective time: <b>${mins} minutes</b>. This is a game timer, not a test grade.</div>`:''}<p><b>EngliForce:</b> Make English your superpower!</p><button class="btn primary" id="finishagain">PLAY AGAIN WITH NEW CLUES</button></div></section>`;$('finishagain').onclick=()=>{if(confirm('Start again? Your current detective file will be cleared.')){st=fresh();persist();render()}}}
function openEvidence(tab='clues'){returnFocus=document.activeElement;activeEvidence=tab;$('modalOverlay').classList.remove('hidden');document.body.style.overflow='hidden';renderEvidence();$('modalClose').focus()}
function closeEvidence(){$('modalOverlay').classList.add('hidden');document.body.style.overflow='';if(returnFocus?.focus)returnFocus.focus()}
function renderEvidence(){let tabs=[['clues','🔎 Facts'],['files','📁 Documents'],['suspects','🕵️ Suspects'],['signals','🔐 Signals'],['notes','✎ My Notes']];$('eTabs').innerHTML=tabs.map(([key,label])=>`<button class="tab ${activeEvidence===key?'active':''}" data-tab="${key}">${label}</button>`).join('');$('eTabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeEvidence=b.dataset.tab;renderEvidence()});let content='',maxComplete=Math.floor(st.step/3);
 if(activeEvidence==='clues'){content='<p class="muted">Only completed missions are in your permanent evidence file.</p>'+SCENES.map((s,i)=>`<div class="evidence"><h3>${i+1}. ${e(s.title)}</h3><p>${i<maxComplete?interpolate(s.clue):'LOCKED — finish this mission to find the evidence.'}</p></div>`).join('')}
 if(activeEvidence==='files'){let indices=[];for(let i=0;i<SCENES.length;i++)if(i<maxComplete||(st.step<TOTAL&&i===sceneIndex()))indices.push(i);content='<p class="muted">You can go back and read earlier case documents.</p>'+indices.map(i=>`<div class="evidence"><h3>${e(SCENES[i].title)}</h3>${SCENES[i].files.map(f=>`<details style="margin:9px 0"><summary style="cursor:pointer;font-weight:bold">${e(f[0])}</summary><p style="padding-top:9px">${e(interpolate(f[1]))}</p></details>`).join('')}</div>`).join('')}
 if(activeEvidence==='suspects'){content='<p>Compare the keycard colour, sticker and locker number. One suspect must match ALL THREE.</p>'+suspectBoard()}
 if(activeEvidence==='signals'){content='<p>Your signal symbols unlock at the end of missions 1–4. Keep the ORDER.</p>'+['HQ','LOCKERS','HOME','PLAYGROUND'].map((name,i)=>`<div class="evidence"><h3>${name}</h3><p>${i<maxComplete?st.signals[i]:'LOCKED'}</p></div>`).join('')+(sceneIndex()===8||st.step>=TOTAL?vaultDecoder():'<p class="muted">The number decoder will be available in the final vault.</p>')}
 if(activeEvidence==='notes'){content='<label for="notesField">Your own detective notes. They are saved on this iPad.</label><textarea id="notesField" class="notes" placeholder="Write names, numbers, symbols and any important details...">'+e(st.notes)+'</textarea>'}
 $('eBody').innerHTML=content;let n=$('notesField');if(n)n.oninput=()=>{st.notes=n.value;persist()}}
$('modalClose').onclick=closeEvidence;$('modalOverlay').addEventListener('click',ev=>{if(ev.target===$('modalOverlay'))closeEvidence()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('modalOverlay').classList.contains('hidden'))closeEvidence()});$('openEvidence').onclick=()=>openEvidence();$('floating').onclick=()=>openEvidence();$('plus').onclick=()=>{st.font=Math.min(4,st.font+1);persist();document.documentElement.style.setProperty('--font',(19+st.font*2)+'px')};$('minus').onclick=()=>{st.font=Math.max(-1,st.font-1);persist();document.documentElement.style.setProperty('--font',(19+st.font*2)+'px')};
render();
</script></body></html>
